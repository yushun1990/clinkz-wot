    "Production public Consumer registration/consume/read talks to production ServientBuilder::produce/begin_expose/step over TCP, with no legacy facade or raw-client substitution. The same nonzero address serves /first?g=1 -> 42 then /second?g=2 -> 43 in distinct authority incarnations. Each performs 100 reads after source/compiler destruction and restores all original shared-bank counters after every call.",
    "Fourteen controlled orders cover explicit call cancellation, deadline-before-cancel, lost call ticket, final Consumer interests, Producer cancel/deadline/final root, each before and after handler dispatch. Consumer cancellation yields Cancelled, deadline-first remains TimedOut, and Producer loss is observed as a real Consumer transport error. A fresh Producer incarnation at the same endpoint returns 43; surviving Consumer handles are reused. All original accounts reach zero after final owners/report retire.",
    "Losing only the Consumer runtime does not destroy retained call/handle interests. Losing all interests records residual remote disposition while physically retiring local ownership. HTTP cancellation cannot retract a received request or undo an invoked handler. Old handler/response owners do not contaminate the successor.",
]

