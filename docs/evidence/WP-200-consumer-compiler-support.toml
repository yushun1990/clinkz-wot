coverage = [
    "Actual ResolvedTargetCompiler configuration is private, immutable and checked in 1..=64; capacity zero, 65 and usize::MAX reject. The digest is an injective versioned encoding of that actual configuration, and lowering copies only the already resolved UTF-8 target.",
    "Consuming typed capture uses safe concrete type identity; Host capture requires the private adapter issued by try_new_consumer. Both retain the original complete Consumer-capable registration and issue only borrowed read-only support metadata, without preparation callbacks or allocation.",
    "A same-compatibility foreign compiler with the same associated cursor/artifact types, ordinary generic Host erasure even of the real closed compiler, actual-configuration mismatch, Producer-only capabilities and unsupported representation cells are rejected while preserving the original owners. Foreign compatibility is invoked at startup only; no foreign preparation callback is reached.",
    "Private-field and use-after-consumption rustdoc negatives reject fabrication of support/checked owners and support reuse. These execute in the isolated Core feature cells; an arbitrary open compiler declaration cannot acquire support.",
    "Typed and public Host preparation succeed with binding IDs 203 and 206, two and five binding-generation increments, diagnostic ordinals 15 and 18, candidate order 19, later plan-set/plan generations, exact actual configuration and compatibility, and ConsumerCall role. Every complete registration identity field and artifact envelope identity is preserved.",
    "Both representations produce owned usable artifacts after actual destruction of the source LogicalInteractionPlan and complete registration. Endpoint drop counters establish complete-owner destruction; typed execution covers UTF-8 and the 64-byte capacity boundary. Host payload projection also establishes that the concrete payload resides inside the acquired slot.",
    "Qualified expected-owner mismatches are exercised before preparation through the existing immutable full identity and candidate projections in both representations. This downstream construction discriminator is explicitly separate from the unadmitted Planning aggregate preflight. Production native cursors additionally capture plan/candidate scalars and reject cross-coordinate progress.",
    "Source-owned fixed pre-bounds/compatibility/start/step/abort/destruction costs and actual native/Host Layouts are queried before preparation. No caller-supplied cost, attestation, lowering callback, destructor, allocator SPI or WorkClass is introduced.",
    "Null is injected through the real global allocator at each new allocation point: startup adapter and per-coordinate slot. Startup rejection returns the same immutable compiler. Slot failure preserves the input/registration and a second physically held coordinate; the private unit trace independently proves no native start occurs before successful slot acquisition.",
    "Foundation rollback restores live charges while preserving peak/largest reservation history using the production slot Layout. Logical reservation is never reported as physical backing; Core does not own the caller's ledger or a parent/global governor.",
    "Repeated zero/short Pending, paid Pending, Failed and fresh-budget retries retain the same physical backing, perform no post-callback allocation or reboxing, and cannot refill the two-step coordinate allowance. The private callback trace proves short Host retries and exhausted Host retries invoke no native callback, and explicit abort invokes it once.",
    "Failed native start frees its acquired vacant slot once. Explicit abort, abandoned pure cursor drop, completed artifact drop and successful consuming payload projection each release the sole slot once. Native cursor/artifact destructors are trivial, allocation-free and own no external cleanup obligation.",
    "Public compatibility/type projection mismatches return the unchanged erased artifact or cursor without allocation or release, including both directions between generic and supported storage kinds. Consumer envelopes retain no Producer route reservation; existing Producer metadata/admission/projection tests and all ten registered Producer gate commands pass.",
    "The isolated fixture runs the actual public production tests (nine under std, four in each portable cell) alongside its historical model. No production measurement or support claim is derived from that model.",
    "Locked workspace validation passes 592 tests with three ignored. Isolated Core and Planning full tests/checks pass in std, no-default and async-no-std. ARM thumbv7em-none-eabihf Core/Planning checks pass for both portable cells; these are compile evidence only.",
]

# PR #144 called the fifth Core registration field priority. Its authoritative
# name is diagnostic_ordinal; Core has no separate priority field. The positive
# tests preserve that nonzero field and the nonzero candidate-order field; they
# introduce no new priority semantics or Planning registration abstraction.
registration_ordering_note = "Nonzero diagnostic_ordinal and candidate_order cover the actual Core contract; no independent Core priority field exists."

