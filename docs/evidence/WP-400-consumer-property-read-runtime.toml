[review_repairs]
review = "github-pr:168#pullrequestreview-5512629306"
reviewed_head = "4d05bc859ee6b16474d8308c8648d22d650df875"
preceding_review = "github-pr:168#pullrequestreview-5512150863"
source_ref = "cf2e0dec522f0854bcc898e1d437cab6e5fca57b"
scope = "Repairs enforce already accepted binding-storage, callback temporary, cancellation-buffer, transfer-capacity, cleanup-item, per-step work and pending-owner status contracts. The final independent review linked by acceptance verifies all six earlier findings fixed and supersedes their changes-required conclusions at the accepted head. No lower-layer API, gate, milestone, admitted scope or workspace topic is changed."
new_integration_regressions = 4
preceding_integration_regressions = 9
binding_storage_limits = "All four Host and all three static byte scopes independently reject disabled/undersized policies and accept exact/larger bounds. Each representation has its own actual shared parent byte account; Host call retention and static resident-slot retention are separately exercised."
report_item_limit = "Complete report size is checked before provisioning; original registrations, policy, clock/parent owners and static report loans return unchanged on rejection."
cleanup_quantum = "One allowance spans each whole public progress operation, including shutdown's nested step and final registration retirement. Indivisible declared operations must fit at startup; valid small-quantum tests defer terminal destruction after cancellation and preserve caller excess credit."
transfer_terminal_report = "Matching acknowledged manual PendingCleanup changes to Complete before delivery/discard destroys raw/Core backing and releases capacities; previously recorded residuals remain residual."
callback_scratch = "Qualification checks captured transient bytes against both poll-temporary limits. Startup pairs local/global scratch once for the installed registration's exclusive-callback lifetime, covering invoke, result/cancel/cancellation-poll and final destructors with no later resource acquisition. Zero/127 reject the 128-byte declaration; exact/129 execute. Shared-parent exhaustion rejects construction before allocation, and retirement makes capacity available while the facade remains live."
transfer_capacity = "Host qualification checks the complete destination size and one slot. Before invocation, actual local/parent CleanupTransferSlotsGlobalMax and CleanupTransferBytesGlobalMax reservations back authority and target acceptance. Zero/undersized bounds fail before effects; exact/larger policies execute transfer. Two-root tests independently exhaust slots and bytes through acceptance/refusal/unread results, preserving rejected inputs, then reuse only released capacity. Delivery/discard crossed with residual/complete verifies charges before actual deallocation."
cancellation_buffer = "The adjacent existing per-call/global buffer kinds also qualify and reserve the conservative whole-call bound before invocation in both representations. Boundary, shared-parent exhaustion and actual destructor-ordering cases verify lifetime and release."

