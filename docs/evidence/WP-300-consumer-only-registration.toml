physical_accounting = "Static client/compiler fields are included in the registration Layout. The checked registration includes support once. Host client/adapter heap provisioning is separate from the inline registration. Static associated State is included in the complete slot; Host State is included in its raw call declaration. Payload storage and the Host decorator are counted separately once. Aggregate output and its largest contiguous request remain separate observations; summed allowances are never allocator requests. Source and shared test counters are baseline caller owners."
transient_accounting = "The downstream client declares 256 binding-private transient bytes and 128 retained payload bytes; Core adds zero transient allocation work. Source-level Layouts/heap intervals are observations, not compiler-generated stack frames or global simultaneous peaks. Existing compiler support reports its own conservative temporary allowance and physical slot Layout."

