[package]
name = "clinkz-wot"
version.workspace = true
edition.workspace = true

description = "clinkz-wot — Rust Web of Things engine. Umbrella crate re-exporting the application-facing API."
license = "Apache-2.0"

[lints.clippy]
# ServientError keeps the frozen allocation-free CoreError inline at the umbrella boundary.
result_large_err = "allow"

[dependencies]
# Always pull in the application-facing stack. Concrete bindings are selected
# directly by applications; feature flags below add optional capabilities.
clinkz-wot-core = { path = "../core", default-features = false }
clinkz-wot-td = { path = "../td", default-features = false }
clinkz-wot-discovery = { path = "../discovery", default-features = false }
clinkz-wot-planning = { path = "../planning", default-features = false }
clinkz-wot-servient = { path = "../servient", default-features = false }

# Optional codecs. Off by default so downstream
# crates can pick the surface they need; turn them on via features.
clinkz-wot-codec-cbor = { path = "../codecs/cbor", default-features = false, optional = true }

[features]
default = ["std"]

# Host storage, caller-driven Servient progress and async discovery clients.
std = [
    "async",
    "clinkz-wot-core/std",
    "clinkz-wot-td/std",
    "clinkz-wot-discovery/std",
    "clinkz-wot-planning/std",
    "clinkz-wot-servient/std",
]

# Async discovery syntax and neutral-layer compilation-cell identity.
async = [
    "clinkz-wot-core/async",
    "clinkz-wot-discovery/async",
    "clinkz-wot-servient/async",
]

# Codec for CBOR payloads (TD 1.1 default content type).
cbor = ["dep:clinkz-wot-codec-cbor"]
