    "No HTTP crate, SDK, parser, socket, readiness runtime, deployment recipe or network execution is added.",
    "No Servient/Foundation production, resource schema/default, compiler issuer, callback family, umbrella, Directory, Producer or Zenoh change.",
    "No package/milestone/gate closure, independent completion acceptance, HTTP latency, embedded backend, hardware-fit, HTTPS/security or v1 qualification claim.",
]
