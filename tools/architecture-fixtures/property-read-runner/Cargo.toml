[package]
name = "clinkz-wot-property-read-architecture-runner"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
clinkz-wot-planning = { path = "../../../planning", default-features = false }
clinkz-wot-core = { path = "../../../core", default-features = false }
clinkz-wot-foundation = { path = "../../../foundation", default-features = false }
clinkz-wot-property-read-binding-fixture = { path = "../property-read-binding", default-features = false }
clinkz-wot-servient = { path = "../../../servient", default-features = false }
clinkz-wot-td = { path = "../../../td", default-features = false }

[features]
default = ["std"]
async = ["clinkz-wot-planning/async",
    "clinkz-wot-core/async",
    "clinkz-wot-foundation/async",
    "clinkz-wot-property-read-binding-fixture/async",
    "clinkz-wot-servient/async",
]
std = ["clinkz-wot-planning/std",
    "clinkz-wot-core/std",
    "clinkz-wot-foundation/std",
    "clinkz-wot-property-read-binding-fixture/std",
    "clinkz-wot-servient/std",
    "clinkz-wot-td/std",
]

[dev-dependencies]
clinkz-wot-planning = { path = "../../../planning", default-features = false }
serde_json = { workspace = true, features = ["std"] }
