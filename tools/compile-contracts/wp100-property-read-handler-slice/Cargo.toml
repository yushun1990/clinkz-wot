[package]
name = "clinkz-wot-wp100-property-read-handler-slice-contract"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false
autotests = false
autoexamples = false
autobenches = false

# Keep this compile contract outside the root workspace. It is driven
# explicitly after the reviewed property-read handler API exists.
[workspace]
resolver = "3"

[dependencies]
clinkz-wot-core = { path = "../../../core", default-features = false }
clinkz-wot-foundation = { path = "../../../foundation", default-features = false }
clinkz-wot-td = { path = "../../../td", default-features = false }

[features]
default = []
async = [
    "clinkz-wot-core/async",
    "clinkz-wot-foundation/async",
]
std = [
    "clinkz-wot-core/std",
    "clinkz-wot-foundation/std",
    "clinkz-wot-td/std",
]
ui-unscoped-async-read-property = ["async"]
ui-unscoped-step-read-property = []

[lib]
path = "src/lib.rs"

[[test]]
name = "semantics"
path = "tests/semantics.rs"

[[bin]]
name = "ui-unscoped-async-read-property"
path = "ui/unscoped-async-read-property.rs"
required-features = ["ui-unscoped-async-read-property"]
test = false
bench = false

[[bin]]
name = "ui-unscoped-step-read-property"
path = "ui/unscoped-step-read-property.rs"
required-features = ["ui-unscoped-step-read-property"]
test = false
bench = false
