[package]
name = "clinkz-wot-wp100-handler-context-contract"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false
autotests = false
autoexamples = false
autobenches = false

# Keep this compile contract outside the root workspace. It is driven
# explicitly after the reviewed HandlerContext API exists.
[workspace]
resolver = "3"

[dependencies]
clinkz-wot-core = { path = "../../../core", default-features = false }
clinkz-wot-foundation = { path = "../../../foundation", default-features = false }
clinkz-wot-td = { path = "../../../td", default-features = false }

[features]
default = []
async = [
    "clinkz-wot-core/async",
    "clinkz-wot-foundation/async",
]
std = [
    "clinkz-wot-core/std",
    "clinkz-wot-foundation/std",
    "clinkz-wot-td/std",
]
ui-private-handler-context = []
ui-handler-context-not-hash = []
ui-handler-context-not-default = []

[lib]
path = "src/lib.rs"

[[test]]
name = "semantics"
path = "tests/semantics.rs"

[[bin]]
name = "ui-private-handler-context"
path = "ui/private-handler-context.rs"
required-features = ["ui-private-handler-context"]
test = false
bench = false

[[bin]]
name = "ui-handler-context-not-hash"
path = "ui/handler-context-not-hash.rs"
required-features = ["ui-handler-context-not-hash"]
test = false
bench = false

[[bin]]
name = "ui-handler-context-not-default"
path = "ui/handler-context-not-default.rs"
required-features = ["ui-handler-context-not-default"]
test = false
bench = false
