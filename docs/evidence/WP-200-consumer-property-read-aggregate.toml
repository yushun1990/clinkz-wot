[[obligation]]
id = 1
name = "Checked capability and config"
evidence = [
    "The public sealed projection accepts Core's production ConsumerCompilerRegistration over StaticBindingRegistration or the public HostBindingRegistration. No Core/TD/Foundation/Servient production source or open compiler eligibility changes.",
    "Config copies 27 existing limits, checks lifetime products and selected table Layouts before progress, and checks support payload/cursor/temporary capacities before callbacks. Missing limits, overflowing structural/work products and disabled step/cleanup/candidate cells reject.",
    "Both public representations reject Basic-valid missing ID, explicit empty effective security, multiple effective definitions and non-NoSec before emitting preflight/output admission. Explicit empty ops produce empty ranges.",
    "Production Planning rustdoc negatives reject raw Thing, a raw compiler, and premature source/complete-registration destruction. Existing Core support tests retain role, identity, actual compiler/configuration and unsupported-cell negatives.",
    "Cleanup constructor rejection preserves the original guard for undersized and wrong-kind cases. Wrong-phase runtime admission returns the unchanged build and capped child ledger; public reservation operations verify the returned child's original ceiling/history.",
]

[[obligation]]
id = 2
name = "Complete deterministic lookup"
evidence = [
    "The public fixture has four BTree-ordered property rows: a-read with original indices 1 and 2, b-empty, c-温度 with original index 1, and z-empty. It retains UTF-8 and empty scopes, relative/raw/resolved targets, content coding and subprotocol.",
    "Both representations select every concrete artifact, preserve candidate ordinal/order zero and full qualified artifact/reference identity, distinguish missing/present-empty/strict-index mismatch, and select the first readable original index when omitted.",
    "An entirely empty readable aggregate retains all four rows. Lookup binary-searches the sealed property table and scans only that row's range; it has no TD or registration access or mutable rebuild path.",
]

[[obligation]]
id = 3
name = "Paid passes and all-bounds barrier"
evidence = [
    "Public tests observe exactly one preflight, then repeat waiting polls with fresh budgets before runtime admission. No preflight replay or source reconstruction occurs.",
    "The public TD-lifetime discriminator lowers only test policy member/number maxima to make the total observable. Inspection/Basic plus both aggregate passes require exactly 2097 units for its source. 2096 fails with DocumentValidationWorkUnitsMax during the second pass after preflight; 2097 and 2098 complete despite intervening zero/fresh budgets.",
    "The exact production source under cfg(test) retains a Form Ready event through twelve one-short copy retries. Items/cleanup and TD semantic classes remain unchanged; no coordinate is acknowledged/partially copied. Exact and one-spare credit copy it once, in both representations.",
    "The test-only observer wraps real checked Core owners without opening production eligibility. Successful preparation records three bounds, three starts and six paid steps in each representation. Every start observes the complete three-bound barrier.",
    "Every materialization allocation failure records zero starts. A real later over-capacity resolved target records three bounds and zero starts in static and Host. Synthetic first/last zero bounds also fail before starts.",
]

[[obligation]]
id = 4
name = "Compiler work and cleanup primitives"
evidence = [
    "Each sequential coordinate retains its original bound remainder. Repeated fresh one-short BindingPolls budgets invoke no step callback; each real compiler completes in its supported two paid steps. Step debits flow once from the child budget into caller and phase/coordinate remainders.",
    "The production bound validator is exercised with zero, each foreign WorkClass, over-step units and checked count-product overflow. Those synthetic declarations are test values, never assertions that the closed compiler emits them.",
    "Bounds/start are prepaid from Core's fixed support; abort/allocation/destruction/release are prepaid before acquisition. Cancellation after the first pending step records three bounds, one start, one step and exactly one abort in both representations.",
]

[[obligation]]
id = 5
name = "Finite phase envelopes and atomic work"
evidence = [
    "For P rows, F readable Forms and S scope entries, materialization has P+F+S+5 items and T copy bytes, where T sums every copied occurrence, including repeated IDs/property names/defaults and security names. Its allocation/release envelope is 2*(P+9*F+S+3). Tables use exact checked capacity Layouts, with no Vec growth or shrink.",
    "Bounds have F+1 items and F*bounds_work; compilation has F items, F*(start_work+compile_step_max) binding work and F times the supported fixed cleanup primitives; sealing has P+F+2 items. Preflight reports the checked sum of remaining item phases. Phase owners and Ready retries cannot refill those allowances.",
    "Reclaim reserves P+F+S+4 item/cleanup operations and the output capacity as byte allowance. It drains one scope/coordinate/row/table operation per call; its byte cursor can span calls under PlanReclaimBytesPerStepMax. Child destruction precedes ledger release.",
    "Atomic Cost tests preserve all classes/lifetime counters on one-short credit, consume exact credit once, retain one-spare credit, and reject exhausted lifetime. Public static and Host output ledgers exercise retained-capacity minus one, exact and plus one, failing the whole aggregate on exhaustion.",
]

[[obligation]]
id = 6
name = "Exact output and disjoint physical accounting"
evidence = [
    "The public footprint's disjoint retained categories exactly equal observed live output allocations. Static inline payload is counted once within coordinate capacity; Host payload is counted once inside each supported slot, with outer erased owners in the coordinate table.",
    "Source/lazy/retained-registration deltas are zero. Registration provisioning and caller source are baseline accounts. The committed cleanup destination/transport account is separate from the output ledger; measured inline slot/draft owners are reported below.",
    "Logical peak includes output, the selected fixed build owner and conservative source-level construction/result transport overlap, plus the supported compiler temporary allowance. It is distinct from allocator-observed heap peak and makes no machine-frame/whole-process claim. Largest request is the checked coordinate allocation, not the output or cleanup allowance sum.",
    "The fixed allocator observer is armed after preflight and sees actual second-pass TD and aggregate requests. Actual retained output equals its remaining live allocations after completion. All failure runs preserve a separately allocated independent owner.",
]

[[obligation]]
id = 7
name = "Source-free failure and terminal root"
evidence = [
    "A fallibly acquired stable output block is installed under the pre-reserved inline manual root before variable collections. The slot and one exclusive state-selected build/draft/rollback lease share its local backing. No suspended pointer targets movable output or a caller frame.",
    "Public null injection covers all 31 observed static and 34 Host requests, including the output block, exact tables, each text/scope copy, TD second-pass requests and all three Host slots. Zero child capacity rejects before an allocator request. Every run preserves another live owner and returns physical controlled bytes to zero.",
    "Cancellation and abandonment are exercised at every actual public step boundary in both representations. First cause survives zero/short byte and item cleanup polls. Failed and successful terminal handles permit actual source and complete-registration destruction before use/cleanup.",
    "The occupied-slot entry rejects before work/allocation. Draft abandonment, rollback take/drop/take, root movement, explicit consuming draft-to-rollback and root-driven terminal release retain all variable output/account objects. No variable collection Drop occurs on build/draft/rollback abandonment.",
    "The advanced coordinator must retain and drive its root and committed account until children are terminal. Dropping an undriven root is not completion or an automatic unbounded destructor. Tests retain that required root; they observe all child allocations released with only the fixed block remaining, then release the block through terminal take/refresh before releasing the cleanup account.",
]

[[obligation]]
id = 8
name = "Consuming completion and existing regressions"
evidence = [
    "Complete destroys the generic input-bearing build before exposing ConsumerPropertyReadDraft<A>. Public tests actually destroy Thing and the complete static/Host registration, then select and inspect every concrete artifact, owned logical input and identity.",
    "The completed exact-coordinate Consumer leaf is unchanged. Locked workspace tests pass 642 cases with three ignored; all ten registered Producer commands pass, including no-default Property Read and the real Zenoh target-feedback probe.",
    "Draft identity and footprint are observations. This change creates no Published state, permit, installation or Servient coordinator path.",
]

[[obligation]]
id = 9
name = "Representation and isolated feature evidence"
evidence = [
    "The aggregate integration executable passes 18 cases in std and 12 in each portable/async cell. Static/public Host share lookup, capacity, invalid input, failure and root-lifecycle expectations while independently exercising their physical slot/output paths.",
    "planning/tests/normal-dependency has exactly Planning as its normal dependency and no dev dependencies. Its normal trees resolve TD validated-thing in all three cells; the product manifest itself requests that capability. Thus this evidence does not rely on the external fixture's direct TD dependency or dev/sibling activation.",
    "Both portable isolated graphs compile actual Planning for thumbv7em-none-eabihf. Historical admission/compiler/TD join matrices and authority checks also pass. ARM results are compile evidence only.",
]

