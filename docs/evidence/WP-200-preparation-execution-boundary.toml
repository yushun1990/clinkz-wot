result = "passed"
assertions = "Core has no normal/optional TD or Planning dependency/re-export. HTTP normal runtime graph has neither TD, Planning nor Serde. Generic Planning authoring does not activate validated-thing/arbitrary_precision; explicit validated-thing activates both. Static runtime construction requires only PollClientBinding, not a preparation trait."
