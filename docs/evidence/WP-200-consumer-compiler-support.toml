    "The independent reviewer must reproduce the public typed/Host positives, both actual null-allocation sites, reservation-history rollback, retained-other-owner and retry/abort/output-release cases, and inspect the raw allocation/Box ownership transfer and conservative temporary-cost accounting.",
    "Read passing required mainline/validation results for the exact final PR head from GitHub. Local execution results and an implementation-context review are not substitutes for that remote evidence or independent acceptance.",
    "Only a separate authorized acceptance transition may mark this evidence passed and the tranche complete/current. Aggregate, gate and milestone admission/acceptance remain separate claims.",
]
