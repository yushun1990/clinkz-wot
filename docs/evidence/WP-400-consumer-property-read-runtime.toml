    "The shared version-1 table below executes identical normalized result cases in both cells. Saturating a pending/unread result cannot overwrite it or start another call. Zero work makes no binding progress. Normal and immediate/polled late results pass through the installed Core mediator once; invalid identity/shape stays Validation and raw errors keep their structured category. Accepted footprint overrun retains the decorated accepted-error owner and lease through terminal release, with no raw result poll or input-rejection rewrite.",
    "Bounded property-name/URI-count/UTF-8/capacity validation and comparison work precede invocation. URI maps move into the name-free selected request; no fallible copy or hidden scan is required. Preconstruction rejection returns options unchanged; Core rejection returns the original request plus remaining selection controls. A subsequent explicit call is a new attempt; Runtime never retries.",
    "First Manual/Deadline/Drop/Drain cause is stable. Child cancellation records intent; the next control step samples fresh time and binds an independent five-tick drain deadline once. Late Manual cancellation at tick 1000 gets deadline 1005 despite the original call deadline 60. Five work refills do not extend it; tick 1006 expires to residual. Callback-error cancellation preserves the original Binding error, retains the complete owner and performs no retry while waiting for residual expiry.",
    "Host TransferRequired validates the complete expected CleanupPhaseContext and named owner, then offers the original whole decorated call, lease, capacities and cause to its prepaid manual destination. Acknowledged acceptance permits manual retention; refusal returns the identical envelope to local retention without a false acknowledgement. Static Core rejects fabricated transfer authority and retains Cancelling associated state until normal acknowledgement or recorded residual followed by destruction. Static acknowledgement failure also reaches a bounded residual. No cleanup fallback allocates or needs another call slot.",
]

