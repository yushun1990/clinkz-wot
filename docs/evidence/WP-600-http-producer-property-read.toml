    "Copied old incarnation requests are rejected before dispatch. The installation's owned reply/future cannot produce an independently arriving setup/delivery result after disposal: there is no detached successor. Pending request/response ownership is exercised through failure/close, not replaced by a fabricated HTTP late-result mechanism. Existing shared Core normal/late sealing tests retain their separate regression scope.",
