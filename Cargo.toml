[workspace]
resolver = "3"
members = [
    "clinkz-wot",
    "codecs/cbor",
    "codecs/json",
    "core",
    "discovery",
    "foundation",
    "planning",
    "protocol-bindings/protocols/http",
    "protocol-bindings/protocols/mqtt",
    "servient",
    "servient/finite",
    "td",
    "tools/design-check",
    "tools/architecture-fixtures/property-read-binding",
    "tools/architecture-fixtures/property-read-runner",
    "tools/architecture-fixtures/consumer-property-read-binding",
    "tools/architecture-fixtures/consumer-property-read-runner",
    "tools/performance-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2024"


[workspace.dependencies]
time = { version = "0.3", default-features = false }

serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }

async-trait = "0.1"
