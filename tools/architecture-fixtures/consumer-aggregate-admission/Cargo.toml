[package]
name = "consumer-aggregate-admission-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
clinkz-wot-planning = { path = "../../../planning", default-features = false, features = ["validated-thing"] }
clinkz-wot-core = { path = "../../../core", default-features = false }
clinkz-wot-foundation = { path = "../../../foundation", default-features = false }
clinkz-wot-td = { path = "../../../td", default-features = false, features = ["validated-thing"] }

[dev-dependencies]
clinkz-wot-consumer-property-read-binding-fixture = { path = "../consumer-property-read-binding", default-features = false }
clinkz-wot-planning = { path = "../../../planning", default-features = false, features = ["validated-thing"] }
consumer-compiler-support-probe = { path = "../consumer-compiler-support", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[features]
default = ["std"]
std = ["clinkz-wot-planning/std","clinkz-wot-core/std", "clinkz-wot-foundation/std", "clinkz-wot-td/std", "consumer-compiler-support-probe/std", "clinkz-wot-consumer-property-read-binding-fixture/std"]
async = ["clinkz-wot-planning/async","clinkz-wot-core/async", "clinkz-wot-foundation/async", "consumer-compiler-support-probe/async", "clinkz-wot-consumer-property-read-binding-fixture/async"]
