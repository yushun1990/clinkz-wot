[package]
name = "clinkz-wot-wp100-logical-time-correction-contract"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false
autotests = false
autoexamples = false
autobenches = false

# Keep this compile contract outside the root workspace. It is driven
# explicitly because the reviewed SourceTimestamp method is not present before
# implementation admission.
[workspace]
resolver = "3"

[dependencies]
clinkz-wot-foundation = { path = "../../../foundation", default-features = false }

[features]
default = []
async = ["clinkz-wot-foundation/async"]
std = ["clinkz-wot-foundation/std"]

[lib]
path = "src/lib.rs"

[[test]]
name = "semantics"
path = "tests/semantics.rs"
