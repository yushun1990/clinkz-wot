[package]
name = "clinkz-wot-discovery"
version.workspace = true
edition.workspace = true

[dependencies]
clinkz-wot-td = { path = "../td", default-features = false, optional = true }
clinkz-wot-foundation = { path = "../foundation", default-features = false, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, features = ["raw_value"], optional = true }
fluent-uri = { version = "0.4", default-features = false, features = ["alloc"], optional = true }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"], optional = true }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"], optional = true }
http-body-util = { version = "=0.1.3", default-features = false, optional = true }
httparse = { version = "=1.10.1", default-features = false, features = ["std"], optional = true }
bytes = { version = "=1.11.1", default-features = false, optional = true }
tokio = { version = "=1.52.3", default-features = false, features = ["net", "rt", "time", "sync", "macros"], optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"], optional = true }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"], optional = true }
base64 = { version = "=0.22.1", optional = true }
zeroize = { version = "=1.9.0", optional = true }

[dev-dependencies]
tokio = { version = "=1.52.3", features = ["io-util", "macros", "rt", "time", "net", "sync"] }
clinkz-wot-binding-http = { path = "../protocol-bindings/protocols/http" }
clinkz-wot-planning = { path = "../planning" }
clinkz-wot-core = { path = "../core" }
clinkz-wot-servient-finite = { path = "../servient/finite" }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }

[features]
default = ["http"]
std = []
http = ["std", "dep:clinkz-wot-td", "clinkz-wot-td/std", "clinkz-wot-td/validated-thing", "dep:clinkz-wot-foundation", "clinkz-wot-foundation/std", "dep:serde", "dep:serde_json", "serde_json/std", "dep:fluent-uri", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:httparse", "dep:bytes", "dep:tokio", "dep:rustls", "dep:tokio-rustls", "dep:base64", "dep:zeroize"]

[[example]]
name = "discover_read"
required-features = ["http"]

[[example]]
name = "secure_discover_read"
required-features = ["http"]
