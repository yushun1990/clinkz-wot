[package]
name = "clinkz-wot-servient"
version.workspace = true
edition.workspace = true

[lints.clippy]
# CoreError is an exact allocation-free no_std schema and remains inline at this boundary.
result_large_err = "allow"

[dependencies]
clinkz-wot-core = { path = "../core", default-features = false }
clinkz-wot-foundation = { path = "../foundation", default-features = false }
clinkz-wot-planning = { path = "../planning", default-features = false, features = ["validated-thing"] }
clinkz-wot-td = { path = "../td", default-features = false }
clinkz-wot-servient-finite = { path = "finite", default-features = false, optional = true }

[dev-dependencies]
serde_json = { version = "1" }
clinkz-wot-consumer-property-read-binding-fixture = { path = "../tools/architecture-fixtures/consumer-property-read-binding", default-features = false }
clinkz-wot-property-read-binding-fixture = { path = "../tools/architecture-fixtures/property-read-binding" }

[features]
default = ["std"]
## Host storage and explicit manual progress; independent of async syntax.
std = [
    "dep:clinkz-wot-servient-finite",
    "clinkz-wot-servient-finite/std",
    "clinkz-wot-core/std",
    "clinkz-wot-foundation/std",
    "clinkz-wot-planning/std",
    "clinkz-wot-td/std",
    "clinkz-wot-consumer-property-read-binding-fixture/std",
]
## Forwards the optional async syntax capability of composed neutral layers.
async = [
    "clinkz-wot-core/async",
    "clinkz-wot-foundation/async",
    "clinkz-wot-planning/async",
]
