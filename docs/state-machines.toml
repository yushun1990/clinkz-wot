schema_version = 2
design_revision = "6.0"
scope = "semantic-boundaries-not-a-public-trait-or-guard-inventory"

[[machine]]
id = "logical-instance"
requirements = ["EXEC-ID-001", "SAFE-AUTH-001"]
states = ["Private", "Live", "Revoked", "Draining", "Released"]
initial = "Private"
terminal = ["Released"]
required_events = []
invariant = "Description/content identity is not authority; finite Consumer calls and notifications share one independently owned currentness reference; facet close is local, authority revoke fences all facets, and replacement cannot retarget old accepted work; physical infrastructure has its own lifetime."

[[machine.transition]]
from = "Private"
event = "admit-current-authority"
to = "Live"

[[machine.transition]]
from = "Private"
event = "abandon-owned-draft"
to = "Released"

[[machine.transition]]
from = "Live"
event = "revoke-new-work"
to = "Revoked"

[[machine.transition]]
from = "Revoked"
event = "drain-original-work"
to = "Draining"

[[machine.transition]]
from = "Draining"
event = "last-local-owner-released"
to = "Released"

[[machine]]
id = "producer-publication"
requirements = ["PREP-COVER-001", "SAFE-PUBLISH-001"]
states = ["Draft", "InstallingClosed", "Finalizing", "Qualified", "Serving", "Draining", "CleanupPending", "Closed", "FailedClosed"]
initial = "Draft"
terminal = ["Closed", "FailedClosed"]
required_events = []
invariant = "No dispatch before Serving. Closed setup may be externally visible. Qualified includes final TD coordinates, actual providers, behavior and required readiness; local publication performs no new fallible native preparation. Closed describes local ownership, not remote rollback."

[[machine.transition]]
from = "Draft"
event = "fund-and-capture-known-dependencies"
to = "InstallingClosed"

[[machine.transition]]
from = "Draft"
event = "reject-with-no-obligation"
to = "FailedClosed"

[[machine.transition]]
from = "InstallingClosed"
event = "actual-participation-ready"
to = "Finalizing"

[[machine.transition]]
from = "Finalizing"
event = "final-td-endpoints-support-and-behavior-qualified"
to = "Qualified"

[[machine.transition]]
from = "Qualified"
event = "final-dependency-cancel-check-and-local-commit"
to = "Serving"

[[machine.transition]]
from = "Serving"
event = "revoke-acceptance"
to = "Draining"

[[machine.transition]]
from = "Serving"
event = "qualification-defect-close-affected-gates"
to = "Draining"

[[machine.transition]]
from = "Draining"
event = "release-logical-participation"
to = "CleanupPending"

[[machine.transition]]
from = "InstallingClosed"
event = "failed-or-cancelled-with-owned-setup"
to = "CleanupPending"

[[machine.transition]]
from = "Finalizing"
event = "failed-or-cancelled-with-owned-setup"
to = "CleanupPending"

[[machine.transition]]
from = "Qualified"
event = "cancel-or-dependency-changed"
to = "CleanupPending"

[[machine.transition]]
from = "CleanupPending"
event = "all-local-owners-complete-or-acknowledged-transfer"
to = "Closed"

[[machine]]
id = "prepared-entry"
requirements = ["PREP-ISOLATION-001", "PREP-DEFER-001", "PREP-COVER-001"]
states = ["OwnedInput", "Constructing", "Ready", "Unsupported", "CleanupPending", "Released"]
initial = "OwnedInput"
terminal = ["Released"]
required_events = []
invariant = "Unsupported is allowed for deferred Consumer candidates; for a fully qualified published Producer this branch is a defect and revokes affected acceptance. Pure output never contains live authority or native infrastructure."

[[machine.transition]]
from = "OwnedInput"
event = "fund-pure-construction"
to = "Constructing"

[[machine.transition]]
from = "Constructing"
event = "immutable-result-generation-checked"
to = "Ready"

[[machine.transition]]
from = "Constructing"
event = "consumer-candidate-unsupported"
to = "Unsupported"

[[machine.transition]]
from = "Constructing"
event = "cancel-limit-or-build-failure"
to = "CleanupPending"

[[machine.transition]]
from = "Ready"
event = "last-content-reference"
to = "CleanupPending"

[[machine.transition]]
from = "Unsupported"
event = "retire-negative-record"
to = "CleanupPending"

[[machine.transition]]
from = "OwnedInput"
event = "abandon"
to = "CleanupPending"

[[machine.transition]]
from = "CleanupPending"
event = "bounded-reclaim-complete"
to = "Released"

[[machine]]
id = "accepted-work"
requirements = ["SAFE-CANCEL-001", "SAFE-CLEANUP-001", "SPI-DELIVERY-001"]
states = ["Reserved", "Running", "ResultRetained", "Cancelling", "Settled", "CleanupPending", "Released"]
initial = "Reserved"
terminal = ["Released"]
required_events = []
invariant = "Local terminal and release differ; original identity/program/principal/reply survives. Remote effect uncertainty and physical owner status remain separate."

[[machine.transition]]
from = "Reserved"
event = "accept-complete-owner-before-effects"
to = "Running"

[[machine.transition]]
from = "Reserved"
event = "reject-return-input"
to = "Released"

[[machine.transition]]
from = "Running"
event = "retain-normal-result"
to = "ResultRetained"

[[machine.transition]]
from = "Running"
event = "first-cause-revoke-delivery"
to = "Cancelling"

[[machine.transition]]
from = "Cancelling"
event = "retain-late-value-or-cancel-outcome"
to = "ResultRetained"

[[machine.transition]]
from = "ResultRetained"
event = "acknowledge-local-terminal"
to = "Settled"

[[machine.transition]]
from = "Settled"
event = "retain-release-obligation"
to = "CleanupPending"

[[machine.transition]]
from = "CleanupPending"
event = "actual-release-or-complete-owner-transfer"
to = "Released"

[[machine]]
id = "action-invocation"
requirements = ["EXEC-ACTION-001", "EXEC-OUTCOME-001"]
states = ["Admitted", "Running", "Terminal", "CleanupPending", "Released"]
initial = "Admitted"
terminal = ["Released"]
required_events = []
invariant = "Action lifetime is not initiating exchange lifetime; querying/cancellation requires supported described operations and pinned native continuation. Local abandonment does not assert remote terminal."

[[machine.transition]]
from = "Admitted"
event = "invoke-under-current-grant"
to = "Running"

[[machine.transition]]
from = "Running"
event = "mapped-query-same-invocation"
to = "Running"

[[machine.transition]]
from = "Running"
event = "request-remote-cancel-under-fresh-permission"
to = "Running"

[[machine.transition]]
from = "Running"
event = "known-terminal-or-local-abandonment-with-remote-status"
to = "Terminal"

[[machine.transition]]
from = "Admitted"
event = "reject-before-effects"
to = "Terminal"

[[machine.transition]]
from = "Terminal"
event = "retain-continuations-and-residue"
to = "CleanupPending"

[[machine.transition]]
from = "CleanupPending"
event = "release-actual-owners"
to = "Released"

[[machine]]
id = "notification-conversation"
requirements = ["EXEC-NOTIFY-001", "SAFE-OVERFLOW-001"]
states = ["Reserved", "Establishing", "Active", "Stopping", "CleanupPending", "Closed"]
initial = "Reserved"
terminal = ["Closed"]
required_events = ["Reserved:cancel-or-fail-before-native-start"]
invariant = "Each Engine logical subscription has independent cursor/permission/stop. Native distribution may share backing; response-bearing topology is qualified. Event loss is not state coalescing. Before native start, cancellation or funding failure retains the first cause and releases prepaid reservation/control/cleanup capacity without claiming a remote effect. Once native setup begins, failure or cancellation retains its actual setup owner through cleanup."

[[machine.transition]]
from = "Reserved"
event = "fund-start-control-result-cleanup"
to = "Establishing"

[[machine.transition]]
from = "Reserved"
event = "cancel-or-fail-before-native-start"
to = "CleanupPending"

[[machine.transition]]
from = "Establishing"
event = "install-original-conversation"
to = "Active"

[[machine.transition]]
from = "Establishing"
event = "failure-or-cancel"
to = "CleanupPending"

[[machine.transition]]
from = "Active"
event = "validated-delivery-and-optional-reciprocal-response"
to = "Active"

[[machine.transition]]
from = "Active"
event = "revoke-local-delivery"
to = "Stopping"

[[machine.transition]]
from = "Active"
event = "visible-loss-terminal-policy"
to = "Stopping"

[[machine.transition]]
from = "Stopping"
event = "mapped-removal-or-unsupported-remote-stop"
to = "CleanupPending"

[[machine.transition]]
from = "CleanupPending"
event = "release-local-lease-and-report-remote-residue"
to = "Closed"

[[machine]]
id = "native-infrastructure"
requirements = ["SPI-NATIVE-001", "SPI-RETIRE-001", "RES-OWNER-001"]
states = ["Owned", "Ready", "Idle", "Reconnecting", "Retiring", "Closed"]
initial = "Owned"
terminal = ["Closed"]
required_events = ["Reconnecting:terminal-reconnect-failure-fence-and-report"]
invariant = "A Thing is not a connection/listener. Logical close releases only its lease. Polling/clone grants no shutdown right. Idle backing remains charged; final destruction requires final-use barrier. Terminal reconnect failure fences affected acceptance and reports retained first cause, dependent terminal/availability and remote effect uncertainty without implying authorized shutdown; the physical owner retains jobs and backing through bounded retirement or acknowledged whole-owner transfer."

[[machine.transition]]
from = "Owned"
event = "native-setup-complete"
to = "Ready"

[[machine.transition]]
from = "Owned"
event = "partial-setup-failure-retains-owner"
to = "Retiring"

[[machine.transition]]
from = "Ready"
event = "bounded-idle-policy"
to = "Idle"

[[machine.transition]]
from = "Idle"
event = "compatible-new-participation"
to = "Ready"

[[machine.transition]]
from = "Ready"
event = "native-failure-fence-dependent-work"
to = "Reconnecting"

[[machine.transition]]
from = "Reconnecting"
event = "equivalent-mapping-ready"
to = "Ready"

[[machine.transition]]
from = "Reconnecting"
event = "terminal-reconnect-failure-fence-and-report"
to = "Retiring"

[[machine.transition]]
from = "Reconnecting"
event = "authorized-shutdown"
to = "Retiring"

[[machine.transition]]
from = "Ready"
event = "authorized-shutdown-revoke-and-drain"
to = "Retiring"

[[machine.transition]]
from = "Idle"
event = "retention-expired-or-owner-shutdown"
to = "Retiring"

[[machine.transition]]
from = "Retiring"
event = "last-packet-reply-callback-job-and-participation-released"
to = "Closed"

[[machine]]
id = "cleanup-owner"
requirements = ["SAFE-CLEANUP-001", "SAFE-DROP-001"]
states = ["Retained", "Offered", "SuccessorOwned", "Complete", "Released"]
initial = "Retained"
terminal = ["Released"]
required_events = []
invariant = "Residual external state is recorded separately; it never authorizes freeing surviving local state. Source transfer is not acknowledgement of final physical cleanup."

[[machine.transition]]
from = "Retained"
event = "offer-complete-owner"
to = "Offered"

[[machine.transition]]
from = "Offered"
event = "rejected-identical-owner-returned"
to = "Retained"

[[machine.transition]]
from = "Offered"
event = "acknowledged-complete-owner-received"
to = "SuccessorOwned"

[[machine.transition]]
from = "Retained"
event = "finite-local-disposal-complete"
to = "Complete"

[[machine.transition]]
from = "SuccessorOwned"
event = "actual-local-disposal-complete"
to = "Complete"

[[machine.transition]]
from = "Complete"
event = "release-charge-once"
to = "Released"

[[machine]]
id = "discovery-client"
requirements = ["DISC-CLIENT-001", "SAFE-CANCEL-001"]
states = ["Created", "Exploring", "Retrieving", "Completed", "Stopping", "CleanupPending", "Closed"]
initial = "Created"
terminal = ["Closed"]
required_events = []
invariant = "Discovery introduction grants neither authenticity nor interaction permission; no implicit Directory service or forced readproperty retrieval."

[[machine.transition]]
from = "Created"
event = "destination-trust-and-capacity-admit"
to = "Exploring"

[[machine.transition]]
from = "Exploring"
event = "bounded-result-link-policy-check"
to = "Retrieving"

[[machine.transition]]
from = "Retrieving"
event = "bounded-continuation"
to = "Retrieving"

[[machine.transition]]
from = "Retrieving"
event = "description-admission-complete"
to = "Completed"

[[machine.transition]]
from = "Exploring"
event = "cancel-or-fail"
to = "Stopping"

[[machine.transition]]
from = "Retrieving"
event = "cancel-or-fail"
to = "Stopping"

[[machine.transition]]
from = "Created"
event = "cancel-before-effects"
to = "Stopping"

[[machine.transition]]
from = "Stopping"
event = "retain-native-retrieval-cleanup"
to = "CleanupPending"

[[machine.transition]]
from = "Completed"
event = "retire-process"
to = "CleanupPending"

[[machine.transition]]
from = "CleanupPending"
event = "release-owned-work"
to = "Closed"

[[composition]]
id = "native-candidate-acceptance"
requirements = ["SPI-INGRESS-001", "SAFE-AUTH-001", "EXEC-ID-001"]
participants = ["logical-instance", "native-infrastructure", "accepted-work"]
preconditions = ["native-candidate-retains-original-token-and-captures", "current-logical-generation-serving-policy-data-and-capacity", "reply-cardinality-qualified", "captured-behavior-and-physical-backing-retained"]
ownership = "Native progress is independently owned; each recipient acceptance is separately linearized. No Engine message copy or universal matcher is required."

[[composition]]
id = "producer-qualified-publication"
requirements = ["PREP-COVER-001", "SAFE-PUBLISH-001"]
participants = ["producer-publication", "prepared-entry", "native-infrastructure"]
preconditions = ["every-final-retained-form-operation-fully-qualified", "actual-behavior-services-bound-endpoints-and-readiness", "deferred-pure-materialization-funded-with-established-support", "final-cancellation-dependency-check-and-nonfallible-local-commit"]
ownership = "One Servient-local transition publishes final description, logical registry and current authority; native setup/control is not application dispatch."

[[composition]]
id = "independent-settlement-and-retirement"
requirements = ["SAFE-CLEANUP-001", "SPI-RETIRE-001"]
participants = ["accepted-work", "cleanup-owner", "native-infrastructure"]
preconditions = ["local-terminal-keeps-original-release-owner", "whole-owner-transfer-is-acknowledged", "physical-release-waits-for-final-use"]
ownership = "Logical release never closes sibling service or certifies remote rollback; infrastructure shutdown has its own authority."
