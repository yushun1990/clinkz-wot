name: mainline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: mainline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          targets: thumbv7em-none-eabihf, thumbv6m-none-eabi

      - name: Check pull-request diff hygiene
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Check pushed diff hygiene
        if: github.event_name == 'push'
        run: git diff --check "${{ github.event.before }}..${{ github.sha }}"

      - name: Validate current technical authority
        run: tools/check-design-artifacts.sh

      - name: Run locked workspace tests
        run: cargo test --workspace --locked

      - name: Exercise product/runtime boundary investigation
        run: |
          runtime_probe_manifest=tools/architecture-fixtures/product-runtime-boundaries/Cargo.toml
          cargo run --locked --manifest-path "$runtime_probe_manifest" -p runtime-boundary-compare
          cargo check --locked --manifest-path "$runtime_probe_manifest" -p static-plan-probe --target thumbv6m-none-eabi
          bash tools/architecture-fixtures/product-runtime-boundaries/check-normal-dependencies.sh

      - name: Check production bounded TD admission and lending
        run: |
          for td_features in validated-thing validated-thing,serde_json/preserve_order; do
            cargo test --locked -p clinkz-wot-td --features "$td_features" --lib validated::tests
            cargo test --locked -p clinkz-wot-td --features "$td_features" --test validated_admission --test validated_lending
          done
          for td_features in validated-thing validated-thing,clinkz-wot-foundation/async validated-thing,td2-preview; do
            cargo test --locked -p clinkz-wot-td --no-default-features --features "$td_features" --lib validated::tests
            cargo test --locked -p clinkz-wot-td --no-default-features --features "$td_features" --test validated_admission --test validated_lending
            cargo check --locked --target thumbv7em-none-eabihf -p clinkz-wot-td --no-default-features --features "$td_features"
          done
          cargo test --locked -p clinkz-wot-td --features validated-thing --doc

      - name: Install ARM runtime emulator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm

      - name: Execute production TD with native and bare ARM allocators
        run: |
          td/tests/runtime/run.sh
          td/tests/runtime/run.sh --features async

      - name: Check production TD capability dependencies
        run: |
          td_capability_manifest=td/tests/compile/validated-capability/Cargo.toml
          for td_profile in std portable async; do
            td_profile_args=()
            td_profile_features=""
            td_serde_axes=(base ap)
            if [ "$td_profile" = std ]; then
              td_serde_axes+=(order ap,order)
            else
              td_profile_args+=(--no-default-features)
              if [ "$td_profile" = async ]; then td_profile_features="async,"; fi
            fi
            for td_axis in "${td_serde_axes[@]}"; do
              td_axis_features="${td_profile_features}"
              if [ "$td_axis" != base ]; then td_axis_features+="$td_axis,"; fi
              for td_activation in capability sibling; do
                cargo check --locked --manifest-path "$td_capability_manifest" "${td_profile_args[@]}" --features "${td_axis_features}${td_activation},positive"
              done
              td_negative_log="$(mktemp)"
              if cargo check --locked --manifest-path "$td_capability_manifest" "${td_profile_args[@]}" --features "${td_axis_features}negative" >"$td_negative_log" 2>&1; then
                cat "$td_negative_log"
                exit 1
              fi
              grep -E 'unresolved imports.*td::ValidatedThing' "$td_negative_log" || { cat "$td_negative_log"; exit 1; }
              rm "$td_negative_log"
            done
          done
          for td_features in capability,positive ap async,capability,positive async,ap sibling,positive; do
            cargo check --locked --target thumbv7em-none-eabihf --manifest-path "$td_capability_manifest" --no-default-features --features "$td_features"
          done

      # Workspace tests cover the default graph; the snapshot's JSON object
      # canonicalization must also execute with the alternate serde map backend,
      # and feature-gated typed fields need their own readback run.
      - name: Verify normalized snapshot feature variants
        run: |
          cargo test --locked -p clinkz-wot-td --lib normalized_snapshot_probe --no-default-features
          cargo test --locked -p clinkz-wot-td --lib normalized_snapshot_probe --features serde_json/preserve_order
          cargo test --locked -p clinkz-wot-td --lib normalized_snapshot_probe --no-default-features --features td2-preview

      - name: Check Number feature boundary prototype
        run: python3 tools/architecture-fixtures/validated-thing-feature-boundary/check.py

      - name: Check bounded atomic Number probe
        run: |
          cargo test --locked --manifest-path tools/architecture-fixtures/bounded-atomic-number/Cargo.toml
          cargo build --release --locked --target thumbv7em-none-eabihf --manifest-path tools/architecture-fixtures/bounded-atomic-number/Cargo.toml

      - name: Check ValidatedThing arena and Planning handoff prototypes
        run: |
          cargo test --locked --manifest-path tools/architecture-fixtures/validated-thing-arena-layout/Cargo.toml
          cargo check --locked --target thumbv7em-none-eabihf --manifest-path tools/architecture-fixtures/validated-thing-arena-layout/Cargo.toml
          cargo check --locked --target thumbv7em-none-eabihf -p validated-thing-planning-handoff-probe

      - name: Check strict ValidatedThing Number lexeme boundary
        run: |
          cargo test --locked --manifest-path tools/architecture-fixtures/validated-thing-strict-number-lexeme/Cargo.toml
          cargo check --locked --target thumbv7em-none-eabihf --manifest-path tools/architecture-fixtures/validated-thing-strict-number-lexeme/Cargo.toml

      - name: Check bounded literal value construction
        run: |
          value_fixture_manifest=tools/architecture-fixtures/validated-thing-value-construction/Cargo.toml
          cargo test --locked --manifest-path "$value_fixture_manifest"
          cargo test --locked --manifest-path "$value_fixture_manifest" --features order
          cargo test --locked --manifest-path "$value_fixture_manifest" --no-default-features
          cargo test --locked --manifest-path "$value_fixture_manifest" --no-default-features --features async
          cargo check --locked --target thumbv7em-none-eabihf --manifest-path "$value_fixture_manifest" --no-default-features
          cargo check --locked --target thumbv7em-none-eabihf --manifest-path "$value_fixture_manifest" --no-default-features --features async

      - name: Check shared resumable RFC3339 prototype
        run: |
          cargo test --locked --manifest-path tools/architecture-fixtures/validated-thing-rfc3339-resumable/Cargo.toml
          cargo check --locked --target thumbv7em-none-eabihf --manifest-path tools/architecture-fixtures/validated-thing-rfc3339-resumable/Cargo.toml

      - name: Check shared Thing and DataSchema Basic source projection
        run: |
          schema_fixture_manifest=tools/architecture-fixtures/validated-thing-schema-kernel/Cargo.toml
          cargo test --locked --manifest-path "$schema_fixture_manifest"
          for schema_features in ap order ap,order validated-thing validated-thing,ap validated-thing,order validated-thing,ap,order; do
            cargo test --locked --manifest-path "$schema_fixture_manifest" --features "$schema_features"
          done
          cargo test --locked --manifest-path "$schema_fixture_manifest" --no-default-features
          for schema_features in async validated-thing async,validated-thing td2-preview,validated-thing; do
            cargo test --locked --manifest-path "$schema_fixture_manifest" --no-default-features --features "$schema_features"
          done
          cargo check --locked --target thumbv7em-none-eabihf --manifest-path "$schema_fixture_manifest" --no-default-features
          for schema_features in ap async async,ap validated-thing validated-thing,ap async,validated-thing async,ap,validated-thing; do
            cargo check --locked --target thumbv7em-none-eabihf --manifest-path "$schema_fixture_manifest" --no-default-features --features "$schema_features"
          done

      - name: Check borrowed Consumer admission discriminator
        run: |
          borrowed_fixture_manifest=tools/architecture-fixtures/consumer-borrowed-admission/Cargo.toml
          cargo test --locked --manifest-path "$borrowed_fixture_manifest"
          cargo test --locked --manifest-path "$borrowed_fixture_manifest" --features order
          cargo test --locked --manifest-path "$borrowed_fixture_manifest" --no-default-features
          cargo check --locked --target thumbv7em-none-eabihf --manifest-path "$borrowed_fixture_manifest" --no-default-features

      - name: Check borrowed Consumer readmission evidence candidate
        run: |
          readmission_fixture_manifest=tools/architecture-fixtures/consumer-borrowed-readmission/Cargo.toml
          cargo test --locked --manifest-path "$readmission_fixture_manifest"
          cargo test --locked --manifest-path "$readmission_fixture_manifest" --features order
          cargo test --locked --manifest-path "$readmission_fixture_manifest" --no-default-features --features validated-thing,async
          python3 tools/architecture-fixtures/consumer-borrowed-readmission/check_boundary.py
          cargo check --locked --target thumbv7em-none-eabihf --manifest-path "$readmission_fixture_manifest" --no-default-features --features validated-thing

      - name: Run no-default Property Read integration tests
        run: cargo test --locked -p clinkz-wot-servient --no-default-features --test property_read

      - name: Check representative feature profiles
        run: |
          cargo check --locked -p clinkz-wot-core --no-default-features
          cargo check --locked -p clinkz-wot-servient --no-default-features
          cargo check --locked -p clinkz-wot-property-read-binding-fixture --no-default-features
          cargo check --locked -p clinkz-wot-property-read-architecture-runner --no-default-features --features async
          cargo check --locked -p clinkz-wot-protocol-bindings-zenoh --no-default-features --features zenoh-pico
