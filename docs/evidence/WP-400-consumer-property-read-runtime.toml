    "Only the accepted owned output/rollback bridge is parked. Each checkout reserves one PlanningItems return credit before removing the complete driver, then releases the structural lock. Selection is a short local borrow with an unwind guard. Driver Drop reparks the identical graph/account once before releasing its strong root; busy never means Idle or spare capacity.",
    "Actual Host driver/handle state crosses threads. Reentrant callbacks observe backpressure without a held structural lock; call-ticket, handle and facade drops during blocked checkout retain the whole call/root until repark. Driver-adapter and transfer-offer unwinding preserve ownership. Completed tickets detach their root reference; stale live tickets/handles prevent new occupants until their bounded interest is released.",
]

