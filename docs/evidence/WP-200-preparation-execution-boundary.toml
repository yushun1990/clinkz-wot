result = "passed"
assertions = "Owned non-Copy native program executes through Core after its counted compiler is destroyed; wrong identity and zero credit retain the old negative oracles and successful output remains sealed. Real HTTP executes over raw TCP after TD, semantic loan, logical plan and preparation owner Drop; accepted call also outlives the completed program. Runtime-only HTTP rejects foreign native payload with matching metadata before any Tokio runtime/I/O. Existing aggregate source-Drop/read/reclaim tests pass."
