[package]
name = "clinkz-wot-binding-http"
version.workspace = true
edition.workspace = true

[lints.clippy]
result_large_err = "allow"

[dependencies]
clinkz-wot-td = { path = "../../../td", optional = true }
clinkz-wot-planning = { path = "../../../planning", optional = true, default-features = false, features = ["std"] }
clinkz-wot-core = { path = "../../../core" }
clinkz-wot-codec-json = { path = "../../../codecs/json" }
clinkz-wot-foundation = { path = "../../../foundation" }
clinkz-wot-servient-finite = { path = "../../../servient/finite" }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.3", default-features = false }
httparse = { version = "=1.10.1", default-features = false, features = ["std"] }
bytes = { version = "=1.11.1", default-features = false }
tokio = { version = "=1.52.3", default-features = false, features = ["net", "rt"] }
socket2 = { version = "=0.6.4", default-features = false }
sha2-const-stable = "=0.1.0"

serde = { workspace = true }
serde_json = { workspace = true, features = ["std", "raw_value"] }

[dev-dependencies]
clinkz-wot-planning = { path = "../../../planning" }
clinkz-wot-servient = { path = "../../../servient" }
serde_json = { workspace = true, features = ["std"] }
tokio = { version = "=1.52.3", default-features = false, features = ["net", "rt", "time"] }

[features]
default = ["prepare"]
prepare = ["dep:clinkz-wot-planning", "dep:clinkz-wot-td", "clinkz-wot-planning/validated-thing"]

[[example]]
name = "read_property"
required-features = ["prepare"]

[[example]]
name = "serve_property"
required-features = ["prepare"]

[[example]]
name = "serve_action"
required-features = ["prepare"]

[[example]]
name = "invoke_action"
required-features = ["prepare"]

[[example]]
name = "read_all_properties"
required-features = ["prepare"]

[[example]]
name = "serve_properties"
required-features = ["prepare"]
