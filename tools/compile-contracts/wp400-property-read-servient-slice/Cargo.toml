[package]
name = "clinkz-wot-wp400-property-read-servient-slice-contract"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false
autotests = false
autoexamples = false
autobenches = false

# This external contract intentionally stays outside the root workspace. It
# must enter WP-400 product code and may not assemble Servient-owned records.
[workspace]
resolver = "3"

[dependencies]
clinkz-wot-core = { path = "../../../core", default-features = false }
clinkz-wot-foundation = { path = "../../../foundation", default-features = false }
clinkz-wot-servient = { path = "../../../servient", default-features = false }
clinkz-wot-td = { path = "../../../td", default-features = false }
clinkz-wot-wp300-property-read-binding-slice-contract = { path = "../wp300-property-read-binding-slice", default-features = false }

[features]
default = []
async = [
    "clinkz-wot-core/async",
    "clinkz-wot-foundation/async",
    "clinkz-wot-servient/async",
    "clinkz-wot-wp300-property-read-binding-slice-contract/async",
]
std = [
    "clinkz-wot-core/std",
    "clinkz-wot-foundation/std",
    "clinkz-wot-servient/std",
    "clinkz-wot-td/std",
    "clinkz-wot-wp300-property-read-binding-slice-contract/std",
]

[lib]
path = "src/lib.rs"

[[test]]
name = "host"
path = "tests/host.rs"
required-features = ["std"]
