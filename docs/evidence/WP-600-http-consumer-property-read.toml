    "TD stores one conservative presence scalar during a separate paid DocumentNodes transition before Form Ready. The getter reads only that scalar. Full inspection/Basic, first cause, source loan, Ready replay and nonrefillable rewind remain intact.",
    "LogicalInteractionPlan owns Option<bool>: direct construction is unknown; Planning always materializes Some(actual paid fact), for restricted, unrestricted and strict complete registrations. No additional backing allocation or source reference is retained.",
    "The existing closed compiler optionally requires Some(false) and exactly application/json. Its SHA-256 restricted configuration derives from the unchanged original key and excludes that key and all 64 strict keys. Client, compiler, support and Host adapter capture the same actual immutable configuration.",
    "Bounds, start and paid step reject unsupported metadata/media with fixed operation/form/plan/binding context. Planning's existing all-bounds barrier rejects the whole transaction before every start. The 64-byte target-copy payload and compatibility remain unchanged, including mock URI acceptance.",
]
