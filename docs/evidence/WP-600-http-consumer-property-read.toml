[framing_slice.sdk_incompatibility]
reproducer = "protocol-bindings/protocols/http/tests/sdk_limits.rs"
command = "CARGO_INCREMENTAL=0 cargo test --locked --offline -p clinkz-wot-binding-http --test sdk_limits -- --test-threads=1 --nocapture"
result = "passed-two-counterexamples"
trailer = "Hyper Builder::max_headers/max_header_size feed both main-head and chunked decoder settings. At 32/8192, real raw peers with 16/17 trailers both deliver; padded raw trailers of 2048/2049 bytes deliver identical maps (X: y). Thus normalized map accounting cannot distinguish the admitted boundary. Decoder put_u8 rejects len >= limit, so setting 2048 rejects a legal exact trailer; 2049 repairs that comparison but rejects admissible 8192-byte main heads. Setting max_headers=16 likewise rejects admissible 32-field heads. Test controls explicitly reproduce these alternatives. No independent trailer setting or raw-span delivery exists on the selected API."
extension = "Decoder CHUNKED_EXTENSIONS_LIMIT=16384 is cumulative and not configurable. A one-byte body with 16383 extension bytes succeeds; 16384 rejects even though the complete response is below 32768 bytes. Public-path controls reproduce the same boundary. Full use of the admitted framing envelope cannot be inferred from the passing exact-total wire cases."
technical_conclusion = "Retain the existing public Consumer/engine and call-owned readiness/driver architecture. The smallest necessary change is an SDK correction exposing independent trailer field/raw-byte limits with inclusive boundary semantics and extension allowance compatible with the already enforced total wire gate. Prefer that scoped correction and requalification to replacing the transport architecture. A replacement SDK is an alternative if those controls cannot be obtained. No SDK patch/fork, new shared API, authority amendment or blanket limit relaxation is implemented here."
completion_boundary = "A corrected pinned SDK must pass these counterexamples with 32/8192 main headers and 16/2048 trailers simultaneously, including padded/exact/one-over/duplicate/truncated/fragmented cases, and allow framing within the admitted cumulative wire envelope. Then exercise successful trailer calls and their resource/retirement failures through the same public Runtime. Until then the tranche remains partial inside its existing admission."

