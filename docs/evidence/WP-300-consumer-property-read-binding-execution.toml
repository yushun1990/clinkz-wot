    "OutboundRequest::property_read constructs the exact name-free request from one ConsumerCall artifact reference plus URI variables and optional deadline; construction rejects non-ConsumerCall artifacts and a plan id whose generation differs from the artifact's plan-set generation",
    "compile-fail evidence proves the removed ThingId and AffordanceTarget constructor parameters and the thing_id and target accessors stay absent, with no ThingSlotId replacement",
    "request binding id, binding generation, plan-set generation, and plan id accessors derive only from one private BindingArtifactRef while the public request exposes no Thing, target, TD, Form, InteractionOptions, provider, candidate, fallback, operation payload, or copied resolved-target field",
    "the implementation changes no security owner and adds no public security carrier; the admitted request remains the no-binding-material baseline",
    "validate_untrusted_binding_output derives expected identities from the live request and delegates to the existing private WP-100 kernel; the installed paths use the same kernel through a private non-Clone single-use seal rather than a second validator",
    "an external Host client authored through clinkz_wot_core::binding::ClientBinding checks compatibility and exact artifact identity before acceptance, returns the exact request on rejection, returns an owned HostBindingCallBox before side effects, reports its immutable footprint and deadline, and covers successful, failed, pending-cancellation, and late-result exits",
    "the complete Host registration validates binding id and generation, configuration, compatibility, plan-set generation, plan id, artifact slot, and ConsumerCall role before transfer, then exposes only a sealed call decorator and no raw installed-client projection",
    "the Host decorator preserves binding errors, deadline behavior, cancellation classification, retry class, and cleanup disposition while validating normal Ok output and cancellation-late Returned(Ok(output)) inside their original branches",
    "Host cleanup transfer acceptance and rejection move or return the complete decorated call with its underlying call, result seal, and immutable accounting still joined as one work object",
    "an external PollClientBinding and ClientRequestSlot exercise synchronous Ready, pending, rejection, zero-budget, cancellation-late, acknowledgement, clear, and next-generation reuse behavior without a subscription member",
    "the opaque StaticConsumerPropertyReadSlot becomes live for every accepted start, seals synchronous output from pre-transfer authority, seals pending normal and cancellation-late output against the exact live request, and permits clear and reuse only after complete-registration acknowledgement of terminal disposition",
    "application-static cancellation receives a phase with no transfer owner, try_into_transfer_request returns that phase unchanged, and an author-fabricated TransferRequired value cannot release the installed slot or activate a transfer envelope, target, reservation, or executor",
    "both installed representations accept valid output and reject binding-id, binding-generation, plan-id, response-selection, missing-metadata, missing-payload, non-Ok status, payload-role, and action-reference negatives after real request transfer; synchronous, pending, and cancellation-late exits are represented",
    "one complete dual-role Host registration and one complete typed StaticBindingComponents registration validate equal compiler, server, client, and artifact compatibility, expose no raw installed Consumer execution projection, and preserve existing Producer-only registration APIs",
    "client compatibility mismatch and an oversized complete static request carrier are rejected during complete registration before publication or protocol work",
    "the Host call remains 'static and portable RequestState has no lifetime tied to the scoped artifact borrow; clients derive only bounded protocol-local state during construction and introduce no per-call copy of resolved target, Form, content type, subprotocol, or artifact payload",
    "the target Host path succeeds with legacy BindingRequest, supports, supports_with_thing, legacy async invoke, and subscribe paths poisoned, proving zero target call edge or conversion to the retained legacy surface",
    "raw Host and static traits remain public authoring SPIs without subscription members, while compile-fail no-bypass evidence proves installed complete registrations cannot project their private raw Consumer client to WP-400",
    "the Host call reports the checked raw footprint plus fixed decorator and seal overhead; arithmetic overflow or admitted-ceiling overrun becomes an accepted Core error that retains the raw call and seal without polling",
    "static complete-registration admission accounts the raw declared request lifetime plus the concrete complete Core slot layout, checks raw transient work against the declared ceiling, and records a zero Core validation transient delta because sealing moves and borrows fixed values without allocation or variable scratch",
    "the exact-head Producer-gate impact review reran every intersecting registered source and command of the passed PROPERTY-READ-ARCHITECTURE manifest and recorded reaffirmation without changing gate status",
    "the locked workspace suite, focused no-default, async-no-std, and std Consumer tests, representative Core checks, authority validation, and pull-request mainline validation pass",
]
