[package]
name = "http-consumer-admission-precheck"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
bytes = { version = "=1.11.1", default-features = false }
http = { version = "=1.4.1", default-features = false }
http-body-util = { version = "=0.1.3", default-features = false }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
tokio = { version = "=1.52.3", default-features = false, features = ["rt", "net", "time", "io-util"] }

[[test]]
name = "connection"
path = "tests/connection.rs"
