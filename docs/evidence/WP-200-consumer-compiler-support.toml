[measurements]
toolchain = "rustc 1.95.0 (59807616e 2026-04-14)"
target = "x86_64-unknown-linux-gnu"
# Every pair is [size, alignment], measured/checked with actual production types.
startup_adapter_layout = [1, 1]
native_cursor_layout = [76, 4]
binding_payload_layout = [65, 1]
native_output_layout = [152, 8]
native_step_result_layout = [312, 8]
host_slot_layout = [152, 8]
host_cursor_owner_layout = [16, 8]
host_output_owner_layout = [104, 8]
native_temporary_allowance = [840, 8]
host_temporary_allowance = [1088, 8]
physical_accounting = "The slot includes its tag, padding, native cursor/output metadata and the binding payload once. Add the applicable outer owner and conservative temporary overlap separately; do not add the 65-byte payload as another retained allocation. SPI cursor/artifact byte declarations remain native semantic declarations; the checked support descriptor supplies actual Host physical Layouts. Startup registration/adapter provisioning is a separate baseline."
temporary_accounting = "The native allowance includes the cursor, step result, native output, inline payload and structured error; Host adds its outer step-result transport. This conservatively covers native output coexisting with the held slot, but is not a compiler-generated machine-stack measurement. Layouts must be queried on the target, not copied as portable constants."
rollback_before_live_peak_largest = [7, 7, 7]
rollback_after_live_peak_largest = [7, 159, 152]
rollback_physical_allocations_acquired = 0
rollback_with_other_held_slot_live_peak_largest = [159, 311, 152]

[fixed_work]
callback_class = "BindingPolls"
cleanup_class = "CleanupItems"
compatibility = 1
bounds = 1
start_native = 1
step_native = 2
step_host_including_transport = 3
maximum_paid_steps = 2
abort_native = 1
destruction_native = 1
allocation_host = 1
release_host = 1
prepayment = "Only step receives/debits a budget under the preserved SPI. The caller prepays the other fixed callbacks and lifetime acquisition/cleanup work from the descriptor before invocation; the precursor introduces no admission governor. Captured Host compatibility/support queries avoid native callbacks entirely."

[memory_check]
tool = "Valgrind 3.27.1 Memcheck"
production_tests_passed = 9
errors = 0
definitely_lost_bytes = 0
indirectly_lost_bytes = 0
possibly_lost_bytes = 48
still_reachable_bytes = 544
residual_attribution = "The full allocation stacks identify the 48-byte block as std::thread::current::init_current via libtest's mpsc context, and the 544-byte block as std's stack-overflow thread-info BTree. Neither stack traverses the new production allocation helper. Exact observed production slot/adapter requests are paired with release; no whole-process zero-retention claim is made."
reproduction = "Build the Core consumer_compiler_support integration executable with cargo test --locked --offline -p clinkz-wot-core --test consumer_compiler_support --no-run --message-format=json, then run the emitted executable under valgrind --leak-check=full --errors-for-leak-kinds=definite,indirect --show-leak-kinds=all --error-exitcode=97 <executable> --test-threads=1."

