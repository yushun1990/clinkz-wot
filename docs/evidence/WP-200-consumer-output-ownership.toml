predecessor_impact = "The completed Consumer aggregate and Consumer-only registration behavior is unchanged. Existing public static/Host aggregate execution, allocation-failure, portable and ARM evidence was re-executed. No prior evidence, gate state, roadmap state or resource limit is changed."

