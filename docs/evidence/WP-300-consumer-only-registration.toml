[[obligation]]
id = 1
name = "Actual client-only complete construction"
evidence = [
    "The normal-library downstream Client implements PollClientBinding and target Host binding::ClientBinding, with no server trait/component. Actual Core owners construct and capture support with zero starts and zero server/route/readiness/response/ingress owner. Static provisioning allocates nothing; Host startup allocates only the supported compiler adapter and actual client.",
    "Input rejection returns immutable complete identity and the exact client. Host rejection compares the original boxed trait-object data address; static rejection preserves preexisting client state. Recovered owners destroy exactly one client. Compiler capture rejects without replacing compiler/configuration or invoking compiler callbacks.",
    "The Core public Host allocation failure scenario retains the original child ledger's 7-byte reservation, peaks/largest history and a separately held compiler slot. Failed acquisition and rollback preserve that owner; explicit abort releases only the original slot once.",
]

[[obligation]]
id = 2
name = "Atomic declaration and compile-contract negatives"
evidence = [
    "Actual constructors reject unsupported selected cells, compiler/identity and client compatibility mismatch, declarations exceeding admitted ceilings, byte/item arithmetic overflow and transient overrun before request execution.",
    "Complete static slot tests cover byte ceiling minus one/exact/plus one, item minus one/exact/plus one and transient minus one/exact. They count the complete Core slot plus binding-private extra storage once, with zero Producer state declarations.",
    "New production compile-fail rustdoc cases reject installed raw client access and mutable compiler access for each owner. Existing seal/support forgery and consuming-capture compile contracts remain enforced. The normal-library fixture checks the Host adapter in std and the static adapter in every cell, including both ARM cells.",
]

[[obligation]]
id = 3
name = "Closed support and actual fallible backing"
evidence = [
    "Both new complete owners capture the actual ResolvedTargetCompiler/supported Host adapter for capacities 32 and 64 and preserve the full nondefault binding identity, generation, configuration, compatibility and diagnostic ordinal through concrete artifact construction and source/registration destruction.",
    "Same-compatibility open impostors, wrong actual configuration and generic Host erasure of even the closed native compiler reject with unchanged owners. Queries do not invoke unsupported compiler callbacks or allocate during capture.",
    "Through the new public complete owner, injected null allocation at supported Host adapter startup returns the original native compiler; injected null at the retained compiler slot returns Backpressure and preserves reservation history. Successful acquisition/abort, another retained slot, invalid native start and final adapter destruction pair exact physical pointers/Layouts and release once.",
]

[[obligation]]
id = 4
name = "Public aggregate, source termination and concrete execution"
evidence = [
    "tests/production.rs uses the real public TD admission and Planning build/preflight/admit/step APIs with both new checked owners. Four ordered properties retain three readable coordinates, original Form indices 1/2/1, UTF-8, relative/raw targets and two empty ranges.",
    "After TD destruction the separate complete registration remains alive, lookup selects concrete static/public Host artifacts and only the new owner's start/poll/acknowledge methods execute requests. Returned payload bytes equal each selected resolved target; binding-native status 599 remains opaque provenance.",
    "Actual final-coordinate target over-capacity and every materialization/Host compiler-slot allocation failure return a source-free rollback owner through the public API. The existing exact-production-source observer separately corroborates three bounds and zero compiler starts on the later bound failure for each new adapter. It supplements the real public positives/failures.",
]

[[obligation]]
id = 5
name = "Shared sealing, cancellation and no bypass"
evidence = [
    "New-owner Core execution matrices cover synchronous, pending, binding-failed and cancellation-late results. Every existing identity/shape negative is exercised in normal and late branches: binding id/generation, plan id, additional-response selection, missing metadata/payload, status, payload role and action reference.",
    "Static Running/Cancelling/Terminal acknowledgement and reuse remain sealed. Pending acknowledgement, live reuse, wrong-branch polling, stale generation and fabricated/caller-provided static transfer authority reject; explicit cancellation settlement permits exactly the original terminal acknowledgement.",
    "Host complete-owner methods use the original decorator, keep accepted resource overrun ownership, preserve opaque binding failure and native status, and transfer the complete raw call/seal/accounting owner for cleanup. The public aggregate tests count exactly three request destructions and one client destruction per representation.",
    "The new Host entry runs with legacy supports/supports_with_thing/invoke/subscribe poisoned and records zero legacy calls. Both public aggregate selectors receive poisoned legacy payload/URI/timeout options without changing the selected artifact reference; source destruction excludes runtime TD rescanning.",
]

[[obligation]]
id = 6
name = "Disjoint measurements and explicit original-root cleanup"
evidence = [
    "The observer measures provisioning, aggregate output and each call in separate allocation intervals. It retains/restores the outstanding output trace while measuring calls and retains the original Host provisioning trace until actual adapter/client destruction. Observer arming does not create a product allocator or admission claim.",
    "Static State is included once inside the complete slot; 128 binding-private payload bytes are a separate declaration. Host raw declaration includes the actual State allocation plus that payload allowance; the original decorator delta is added once. Checked registration Layout includes the unchecked owner and support once, without adding the owner twice.",
    "The public tests explicitly drop each output, acknowledge each static slot or destroy each Host call, destroy the separate complete registration, and drive the draft's source-free rollback through the original retained cleanup root/account. Abandoned cleanup leases return to that same root and are driven again. The original committed charge stays live until terminal refresh, root destruction and explicit account release.",
    "Every success/failure terminal path asserts zero tracked artifact/root bytes, zero call payload/decorator bytes, zero retained Host adapter/client backing, exactly-once client/request destruction and zero original cleanup-account charge. Inline owner Layouts are not treated as heap allocations or device RAM bounds.",
]

[[obligation]]
id = 7
name = "Features, dependencies and Producer reaffirmation"
evidence = [
    "Rust 1.95.0 locked/offline workspace validation passes 658 tests with 3 ignored. Core/Planning portable and async-no-std tests, all isolated Consumer compiler/aggregate/runtime-entry regressions and TD semantic join regressions pass.",
    "The actual runtime-entry library compiles in both thumbv7em-none-eabihf cells and emits target-specific Layout data. Isolated normal-dependency check/tree commands pass in std/no-default/async, without workspace feature unification establishing the capability.",
    "All ten registered Producer gate commands, active authority/API/DAG/ADR/resource/performance checks and formatting/diff checks pass. No accepted claim was falsified; the registry, roadmap, state/resource contracts and gate statuses are unchanged.",
]

