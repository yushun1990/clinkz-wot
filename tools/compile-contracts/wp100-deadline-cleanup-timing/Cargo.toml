[package]
name = "clinkz-wot-wp100-deadline-cleanup-timing-contract"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false
autotests = false
autoexamples = false
autobenches = false

# Keep this compile contract outside the root workspace. It is driven
# explicitly because the reviewed Deadline API is absent before admission.
[workspace]
resolver = "3"

[dependencies]
clinkz-wot-core = { path = "../../../core", default-features = false }
clinkz-wot-foundation = { path = "../../../foundation", default-features = false }

[features]
default = []
async = ["clinkz-wot-core/async", "clinkz-wot-foundation/async"]
std = ["clinkz-wot-core/std", "clinkz-wot-foundation/std"]
ui-private-deadline-instant = []

[lib]
path = "src/lib.rs"

[[test]]
name = "semantics"
path = "tests/semantics.rs"

[[bin]]
name = "ui-private-deadline-instant"
path = "ui/private-deadline-instant.rs"
required-features = ["ui-private-deadline-instant"]
