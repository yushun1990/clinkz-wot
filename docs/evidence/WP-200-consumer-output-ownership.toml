[[obligation]]
id = 1
name = "Unique structural transfer and exact reattachment"
evidence = [
    "ConsumerPropertyReadOwnedOutput and ConsumerPropertyReadOwnedRollback are public std-only, private-field, non-Clone owners. No unsafe Send/Sync implementation exists. Their ManuallyDrop<Box<Node<A>>> is structurally Send only when A and the complete retained graph are Send; Node's Cell/UnsafeCell representation supplies no Sync capability.",
    "try_from_local checks that fixed cleanup is absent, the slot anchor and state-selected lease have the same physical pointer, the phase is exactly Draft or Rollback, and the node has exactly two references. Public reservation tuples, generation, ceilings and footprint are never treated as authority.",
    "After all fallible validation and one PlanningItems debit, the two consumed Root destructors are suppressed and Box::from_raw assumes unique ownership of the original alloc(Layout::new::<Node<A>>()) block. Data remains ManuallyDrop. into_local uses Box::leak without allocation, restores reference count two and constructs one lease plus its original slot metadata before exposing a loan.",
    "Rustdoc compile-fail contracts reject cloning, private-field construction, Sync use and Send transfer with Rc artifacts. Existing compile contracts continue to reject moving or sharing Draft, CleanupSlot and Rollback, including Arc/Mutex wrappers.",
]

[[obligation]]
id = 2
name = "Completed public output crosses a thread and executes"
evidence = [
    "The public test constructs an actual paid four-property/three-coordinate aggregate through the completed Host Consumer-only registration, destroys the TD, records full registration/generation identity, footprint, reservation, artifact reference and concrete artifact address, then calls ConsumerPropertyReadOwnedOutput::try_from_local.",
    "The owner moves to another std thread, reattaches allocation-free, preserves every recorded value and runs the original public selector. The selected Host artifact keeps the same address and drives OutboundRequest::property_read through HostConsumerBindingRegistration::start_consumer_property_read and the sealed result path; the returned payload is the original resolved target.",
    "The receiving thread consumes the same local pair into another owned output using fresh one-unit credit and returns it across the thread boundary. The origin reattaches it with no second charge. Both conversions leave all non-Planning work classes untouched; into_local accepts no budget.",
]

[[obligation]]
id = 3
name = "Partially paid rollback crosses a thread"
evidence = [
    "After the repeated output round trip, the original draft becomes the original variable rollback. One CodecInputBytes unit is paid against the final five-byte scope without releasing an object. First cause and live/peak/largest ledger observations are captured before transfer.",
    "ConsumerPropertyReadOwnedRollback moves the complete rollback/root graph to another thread. Reattachment preserves first cause, all three ledger observations and reservation metadata. An exact four-byte budget then releases that five-byte scope; this executable boundary fails if the prior paid byte were reset or copied into a new reclaimer.",
    "Dropping the reattached rollback returns its lease to the same root; take resumes the existing Rollback::step algorithm. Every child and the original node are explicitly drained on the receiving thread before the separately retained original cleanup account is released on the origin thread.",
]

[[obligation]]
id = 4
name = "Failure ownership and fixed work"
evidence = [
    "Zero credit returns the original draft/root or rollback/root with fixed Backpressure and no changed work counter. Exact credit consumes one PlanningItems unit only. Every repeated detach requires fresh caller credit; reattachment consumes none.",
    "Two independent paid graphs have equal public reservation tuples. Cross-pairing their owners returns Validation, both original graphs, unchanged identity/footprint/artifact address/account charges and the unconsumed work unit. Vacant and fixed-occupied roots reject identically before work.",
    "A pre-allocation fixed rollback is returned unchanged with UnsupportedOperation and uses its existing local fixed cleanup path. Draft abandonment and rollback abandonment return the variable lease to the original slot, which remains the sole manual cleanup root.",
    "The downstream binding start counters remain zero across every conversion rejection. Source inspection and exact allocator snapshots show no selector/compiler/cleanup callback, variable traversal or semantic progress in either conversion method.",
]

[[obligation]]
id = 5
name = "No allocation, copy, forged account or premature release"
evidence = [
    "The fixture snapshots allocator request/deallocation counts, live/peak/largest bytes and every tracked pointer/Layout around each successful and failed conversion. All snapshots are byte-for-byte unchanged. The concrete artifact address and original node identity survive both completed-output round trips and rollback transfer.",
    "The Host aggregate retains the predecessor's 34 real output allocation requests. Final explicit cleanup releases all 34 tracked requests, reports zero tracked live bytes and deallocates the first/original Node exactly once. Valgrind finds no invalid access and no definite or indirect leak.",
    "The original committed cleanup ResourceAccount is a separate object: its charge is unchanged while the graph crosses either thread and while children drain. It is released only after the receiving thread has refreshed/destroyed the terminal slot and reported zero output backing.",
    "No resource kind, WorkClass, parent permit, dependency or allocator path is added. Public owner/return/local-pair Layouts and conservative overlap remain below the existing 2160-byte Host cleanup capacity; no layout sum is presented as an allocator request.",
]

[[obligation]]
id = 6
name = "Existing algorithms, features and regressions"
evidence = [
    "Planning build, selection, artifact, allocation, footprint, ledger and Rollback::step bodies are unchanged. The bridge stores the original Node plus existing slot owner/generation/bytes only; it contains no selector, copier, callback, cleanup cursor or resource account.",
    "The runtime-entry std fixture passes 24 integration/unit cases plus seven compile contracts, including static and Host aggregate execution, all materialization/Host-slot allocation failures, complete registration failures and the historical independent construction discriminators. Its no-default and async-no-std cells each pass ten integration/unit cases plus five compile contracts.",
    "The actual runtime-entry normal library compiles for thumbv7em-none-eabihf in no-default and async-no-std cells. Those cells do not expose the std bridge and remain compile evidence only.",
    "Rust 1.95.0 locked/offline workspace tests, active authority/API/DAG/ADR/resource/performance checks, formatting and diff hygiene pass. No gate manifest, tranche status, PLAN status or WP-400 source is modified.",
]

