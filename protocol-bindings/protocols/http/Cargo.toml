[package]
name = "clinkz-wot-binding-http"
version.workspace = true
edition.workspace = true

[lints.clippy]
result_large_err = "allow"

[dependencies]
clinkz-wot-td = { path = "../../../td" }
clinkz-wot-core = { path = "../../../core" }
clinkz-wot-foundation = { path = "../../../foundation" }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.3", default-features = false }
httparse = { version = "=1.10.1", default-features = false, features = ["std"] }
bytes = { version = "=1.11.1", default-features = false }
tokio = { version = "=1.52.3", default-features = false, features = ["net", "rt"] }
socket2 = { version = "=0.6.4", default-features = false }
sha2-const-stable = "=0.1.0"

[dev-dependencies]
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
clinkz-wot-planning = { path = "../../../planning" }
clinkz-wot-servient = { path = "../../../servient" }
serde_json = { workspace = true, features = ["std"] }
tokio = { version = "=1.52.3", default-features = false, features = ["net", "rt", "time"] }
