[package]
name = "clinkz-wot-wp200-property-read-route-reservation-contract"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false
autotests = false
autoexamples = false
autobenches = false

# This external contract is intentionally outside the root workspace. It
# proves that route identity comes from the real compiler/artifact boundary.
[workspace]
resolver = "3"

[dependencies]
clinkz-wot-core = { path = "../../../core", default-features = false }
clinkz-wot-foundation = { path = "../../../foundation", default-features = false }
clinkz-wot-planning = { path = "../../../planning", default-features = false }
clinkz-wot-td = { path = "../../../td", default-features = false }
clinkz-wot-wp300-property-read-binding-slice-contract = { path = "../wp300-property-read-binding-slice", default-features = false }

[features]
default = []
async = [
    "clinkz-wot-core/async",
    "clinkz-wot-foundation/async",
    "clinkz-wot-planning/async",
    "clinkz-wot-wp300-property-read-binding-slice-contract/async",
]
std = [
    "clinkz-wot-core/std",
    "clinkz-wot-foundation/std",
    "clinkz-wot-planning/std",
    "clinkz-wot-td/std",
    "clinkz-wot-wp300-property-read-binding-slice-contract/std",
]

[lib]
path = "src/lib.rs"

[[test]]
name = "route_reservation"
path = "tests/route_reservation.rs"
required-features = ["std"]
