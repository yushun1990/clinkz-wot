source_revision_rule = "The shared amendment production and primary regression changes are committed at implementation_ref. production_slice, framing_slice and their review_correction tables each name exact source revisions. Earlier observations retain historical scope; framing_slice's rejected candidate is not active production authority or an accepted guarantee. Its review_correction records the subsequent safe scope. fixture_ref additionally renews the existing native/ARM TD runtime fixture's Ready-relative zero-URI suffix and repair positions for the admitted paid metadata transition, and exercises the cached getter under its protected Ready retry. The URI algorithm, independent 162/255-unit charge totals and negative generators are unchanged. Evidence-only edits do not change production or fixtures. Each verification row retains its actual revision and provenance. parser_policy_amendment describes its docs-only revision: production/committed tests/lock at that revision equal base_ref from that table, with Transfer-Encoding refused. stock_hyper_v4 names the subsequent production/fixture checkpoint and supersedes refusal as current behavior; earlier measurements remain historical. Its standalone SDK probes are documentation-extracted counterexamples, not enabled production or transferred fork measurements."

