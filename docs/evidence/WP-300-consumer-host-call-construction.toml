[[obligation]]
id = 1
name = "Actual recoverable public concrete construction"
evidence = [
    "public_try_new_handles_zst_overalignment_pinning_and_returns_original_concrete_owner uses the production public method. ZST construction attempts zero allocations and destroys once. The 256-byte/256-aligned !Unpin owner attempts exactly one matching Layout; null returns its original request, URI string address and shared identity without pinning or destruction. Success preserves the pinned concrete address while moving the erased owning box and releases exactly once.",
    "both_backing_failures_return_the_exact_request_before_protocol_work injects null at each actual Core/raw allocation through both complete registrations and both prospective normal/overrun resource ceilings. Core failure invokes no raw callback. Raw failure recovers the unchanged request before failed-state destruction. No footprint, result or cancellation callback runs, no acceptance/protocol side effect occurs, and the original URI allocation is destroyed once only after explicit returned-request release.",
    "The finite supported witness prepares its output and request backing before observation, then attempts only the recoverable concrete call box. No response construction or other raw allocation is hidden inside invoke. This evidence applies to the fresh fixed helper inputs and prebuilt output, not arbitrary equal-looking String capacities or protocol clients.",
]

[[obligation]]
id = 2
name = "Complete Core backing and exact accepted ownership"
evidence = [
    "Identity mismatch is rejected with no allocation or raw invocation. Envelope null returns structured Binding-phase Backpressure with original plan/binding context and complete input. Raw rejection after provisioning releases the vacant envelope once and returns the exact second request without acceptance.",
    "Both complete registrations measure the same Core-first/raw-second allocations, one raw footprint inspection and no construction polling. Normal, item-only overflow, byte-only overflow and combined overflow all attempt zero allocations after acceptance; the owner survives terminal reporting until explicit release. Separate finite byte ceiling minus-one/exact/plus-one and item ceiling minus-one/exact/plus-one cases select the expected normal/accepted-error mediator.",
    "The !Unpin raw witness checks its concrete address in footprint/deadline/result/cancel callbacks and Drop. The production envelope contains only movable Pin<Box<_>> owners; safe Unpin projections never move concrete pinned raw state. Accepted-error reporting never polls raw state or manufactures request rejection.",
]

[[obligation]]
id = 3
name = "Unchanged sealing, settlement and whole-call cleanup"
evidence = [
    "normal_and_both_late_paths_preserve_validation_raw_errors_budget_and_deadline covers normal poll_result, immediate start_cancel Returned and pending-then-poll_cancel Returned in both complete Host forms. All nine existing invalid identity/shape cases, valid/native-status-599 output and exact structured raw errors keep the original normal-versus-Returned classification. Zero-credit calls remain Pending; deadlines delegate unchanged; all observed callbacks allocate zero times.",
    "cancellation_and_rejected_accepted_settlement_retain_raw_until_explicit_release covers Pending, zero-credit cancellation, explicit Complete settlement and accepted-overflow Returned(error). The latter retains raw state/seal, delegates no raw callbacks, reports saturated accounting and preserves its terminal poll_cancel error. Successful and rejected-accepted raw owners are destroyed exactly once at final explicit release.",
    "cleanup_offers_preserve_complete_call_first_cause_accounting_and_unused_seal covers accepted and rejected offers in both complete forms. The complete original phase, named owner, reservation, first cause, raw owner and footprint survive. Cleanup capacity is conservatively declared as eight items/4096 bytes. A late Returned result still consumes the original unused Core seal after succession, with zero allocation and final exact raw/envelope release.",
    "Existing static and Host integration tests, compile-fail contracts and the downstream local-worker discriminator are rerun. Static Running/Cancelling/Terminal acknowledgement, generation checks, no raw installed bypass and caller-disinterest ownership remain unchanged. The Core decorators' result/cancel/transfer algorithms are unchanged.",
]

[[obligation]]
id = 4
name = "Native allocation, transport and transient accounting"
evidence = [
    "The private Core unit observation records envelope/disposition/backing-attempt Layouts, both mediators, seal and fixed error. The external observer pairs concrete allocation and deallocation pointers/Layouts and checks live/peak bytes, exactly one release per block and zero tracked terminal bytes. No logical declaration is treated as an allocator request.",
    "Core backing is one item/344 bytes, including vacant/tag/maximum branch storage, in both reported footprints. Normal mediation's 112-byte member is inside that allocation and is not added again. Raw allowance 7/2048 plus envelope 1/344 reports 8/2392; either arithmetic overflow saturates both dimensions. The immutable 16-byte boxed carrier and 432-byte installed Result remain distinct inline transport costs.",
    "The concrete construction interval has 344-byte vacant Core backing overlapping 400-byte raw backing: 744 live bytes, both retained until release. Fresh request storage is separately observed as 552 bytes. Output construction has a temporary four-byte Vec, 24-byte Arc body and 16-byte content type, with 40 bytes retained. Raw state, request and response fit the conservative 2048-byte raw declaration. Shared client/statistics and artifact owners are separately provisioned, not charged as a second call envelope.",
    "The 2048-byte binding-private transient declaration covers finite raw value/return transport and failed-state destruction. Core's vacant allocation is already charged once and must be reserved across raw construction/failure by the future runtime. Native inline Layouts are observed separately; no generated stack-frame bound is inferred. Parent/global authority and actual runtime capacity admission remain WP-400 obligations outside this precursor.",
    "The unchanged older downstream fixture now measures heap peaks 512/520/512 and complete declaration 584 (raw 240 plus Core 344), with five allocation requests per call and complete terminal release. Historical 280/288/280 peaks and 352-byte declarations are not carried forward as current evidence.",
]

[[obligation]]
id = 5
name = "Finite callback attestation, portable cells and Producer compatibility"
evidence = [
    "The witness is bound to the existing TestCompiler/TestArtifact complete registration helpers: Host-erased, binding 43, initial generation, configuration [47;32], compatibility [41;16], plan 72 and fresh one-entry room=west requests with four-byte String backing. Output is one prebuilt four-byte payload with fixed content type or fixed Core error. Larger inputs, over-capacity equal-looking strings and real protocol libraries are not attested.",
    "invoke performs fixed identity/input inspection, one nonblocking try_lock/take, one Arc clone and one recoverable concrete allocation. Footprint/deadline read fixed fields. Each result/cancel step prepays one BindingPolls unit, has fixed entry cost and finite settlement; zero credit makes no progress and needs caller credit/refill, while ready output needs no wake registration. Drop releases one finite map, at most one fixed output and a shared counter reference. Null-path and terminal destruction allocate zero times. No hard wall-clock or generic callback certificate follows.",
    "The older downstream client deliberately retains HostBindingCallBox::new: the actual Core envelope failure now recovers, while its four remaining raw infallible allocation sites still SIGABRT before raw acceptance in both resource branches. This negative eligibility evidence demonstrates that new, valid registration and compiler support do not imply bounded Consumer runtime eligibility.",
    "Core std/no-default/async-no-std suites and std+async target binding/compiler suites pass; runtime-entry passes all three cells and compiles its actual normal-library dependencies in both ARM cells. Rust 1.95.0 and 1.99.0 focused suites and private Layout observations agree. All ten registered Producer commands pass, including seven real Zenoh feedback cases. Static source/contracts, Producer implementation and manifests are unchanged.",
]

