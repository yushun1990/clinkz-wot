[[evidence]]
key = "http-form-eligibility"
execution_status = "passed"
acceptance_status = "pending-independent-review"
observations = [
    "The former pre-code form_metadata discriminator now calls the real public paid getter, owned plan scalar, checked configuration and closed compiler in std/no-default/async-no-std. It retains default, explicit GET, POST, header, unknown nested extension, response JSON/non-JSON, empty/nonempty additionalResponses, identity coding, empty subprotocol and empty/nonempty scopes, plus typed Form round trips.",
    "Zero-work polls cannot advance to Ready. The final metadata transition consumes exactly one DocumentNodes unit; zero-credit Ready retries preserve the scalar. Rewind reproduces both true and false facts without restoring lifetime credit. TD cancellation retains its first cause through acknowledge/rewind/retry. Complete original inspection/Basic and URI/resource tests pass.",
    "Native compiler matrix covers unknown/false/true metadata with missing, JSON, non-JSON, parameterized and uppercase media. Bounds, start and paid step fail closed with exact fixed context. Every short native/Host step budget preserves the continuation and allowance. Original strict/unrestricted copy behavior remains eligible for the same inputs.",
    "Actual restricted/unrestricted client mismatch, compiler input/cursor substitution and artifact submission are rejected in both directions. Complete owner/client address and unchanged rejected request survive; the raw client is not reached. The private public Host adapter and pre-start slot each receive real null-allocation refusal and successful retry controls in both modes. Host eligibility failure retains its slot until abort.",
    "Actual public Planning materializes source-free true/false facts for static and Host complete owners. Fourteen later-Form metadata/media negatives fail on the third bounds callback with zero starts/steps/aborts. Public failures return funded rollback, preserve the independent owner and original cleanup account, end controlled live bytes at zero, and retry successfully on the same registration/root. Every restricted materialization/compiler-slot allocation refusal is exercised.",
    "Production static and public Host Runtime consume reject a later present-empty Form before publication or client start, reclaim, then retry valid Forms on the same runtime. Two property targets execute after source destruction in normal and late-result/cancellation modes; taking the sealed result allocates zero and original parent accounts end at zero.",
]
