[package]
name = "clinkz-wot-consumer-property-read-runtime-runner"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
clinkz-wot-planning = { path = "../../../planning", default-features = false }
clinkz-wot-servient = { path = "../../../servient", default-features = false }
clinkz-wot-core = { path = "../../../core", default-features = false }
clinkz-wot-foundation = { path = "../../../foundation", default-features = false }
clinkz-wot-td = { path = "../../../td", default-features = false }
clinkz-wot-consumer-property-read-binding-fixture = { path = "../consumer-property-read-binding", default-features = false }

[dev-dependencies]
clinkz-wot-planning = { path = "../../../planning", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[features]
default = ["std"]
std = ["clinkz-wot-planning/std","clinkz-wot-servient/std", "clinkz-wot-core/std", "clinkz-wot-foundation/std", "clinkz-wot-td/std", "clinkz-wot-consumer-property-read-binding-fixture/std"]
async = ["clinkz-wot-planning/async","clinkz-wot-servient/async", "clinkz-wot-core/async", "clinkz-wot-foundation/async", "clinkz-wot-consumer-property-read-binding-fixture/async"]
