version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
clinkz-wot-planning = { path = "../../../planning", default-features = false }
clinkz-wot-core = { path = "../../../core", default-features = false }
clinkz-wot-foundation = { path = "../../../foundation", default-features = false }

[features]
default = ["std"]
std = [
    "clinkz-wot-planning/std","clinkz-wot-core/std", "clinkz-wot-foundation/std"]
async = [
    "clinkz-wot-planning/async","clinkz-wot-core/async", "clinkz-wot-foundation/async"]
