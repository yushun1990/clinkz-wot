name: full-validation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: full-validation
  cancel-in-progress: true

jobs:
  validation:
    name: full-validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0

      - name: Validate current technical authority
        run: tools/check-design-artifacts.sh

      - name: Run locked workspace tests
        run: cargo test --workspace --locked

      - name: Run no-default Property Read integration tests
        run: cargo test --locked -p clinkz-wot-servient --no-default-features --test property_read

      - name: Validate the supported feature matrix
        run: sh scripts/check-feature-matrix.sh
