name: temporary-v5.1-activation-runner

on:
  push:
    branches:
      - docs/v5.1-consumer-one-shot-activation
    paths:
      - .github/workflows/tmp-v5.1-activation-runner.yml

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v5.1-consumer-one-shot-activation
      - name: Apply activation patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply-v5.1-activation.py')
          text = path.read_text(encoding='utf-8')
          old = '''if text.count('\"5.0\"') != 2:\n    raise SystemExit('design-check expected exactly two v5.0 selectors')\ntext = text.replace('\"5.0\"', '\"5.1\"')'''
          new = '''for old_selector, new_selector in [\n    ('require_root_string(&document, \"current_design_revision\", \"5.0\", relative)?;',\n     'require_root_string(&document, \"current_design_revision\", \"5.1\", relative)?;'),\n    ('require_root_string(&document, \"design_revision\", \"5.0\", relative)?;',\n     'require_root_string(&document, \"design_revision\", \"5.1\", relative)?;'),\n]:\n    if text.count(old_selector) != 1:\n        raise SystemExit(f'design-check selector anchor mismatch: {old_selector}')\n    text = text.replace(old_selector, new_selector, 1)'''
          if text.count(old) != 1:
              raise SystemExit('activation patch-script selector block mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tools/apply-v5.1-activation.py
          python3 tools/check-v5.1-authority.py
          git diff --check
      - name: Commit activation checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs(authority): activate v5.1 Consumer one-shot authority'
          git push origin HEAD:docs/v5.1-consumer-one-shot-activation
