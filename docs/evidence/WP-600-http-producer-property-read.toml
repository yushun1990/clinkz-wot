observations = [
    "An independent std TcpStream peer observes one HTTP/1.1 200/JSON reply and one registered handler invocation. Unpublished/zero-credit paths cannot accept/dispatch/respond successfully. HandlerSteps and BindingPolls are independent debits. The public two-generation loop additionally executes default GET and aliased explicit GET/status with relative hrefs on distinct exact paths/queries.",
    "Wrong method/path/Host, duplicate Host, body/TE framing, pipelining, Expect and upgrade refuse without dispatch. Head byte 8192 and field 16 succeed; one over fails, including unfinished-input boundaries. Complete write-half-closed requests retain their reply, while incomplete EOF retires without dispatch and permits a fresh request.",
    "Invalid Core shape, oversize body, malformed JSON and invalid UTF-8 at top-level/nested strings/keys never become successful JSON. Unfinished-head and accepted dispatch/reply deadlines close Serving; real peer-reset during reply closes authority and retains first cause. Local completion is not remote receipt.",
]

