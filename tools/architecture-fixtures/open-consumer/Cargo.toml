[package]
name = "independent-open-consumer"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately not a workspace member. The only preparation/runtime connection
# is the published Cargo API; no private module or built-in protocol case.
[workspace]

[dependencies]
clinkz-wot-core = { path = "../../../core" }
clinkz-wot-foundation = { path = "../../../foundation" }
clinkz-wot-planning = { path = "../../../planning", optional = true }
clinkz-wot-td = { path = "../../../td", optional = true }

[dev-dependencies]
clinkz-wot-servient-finite = { path = "../../../servient/finite" }
clinkz-wot-binding-http = { path = "../../../protocol-bindings/protocols/http", default-features = false, features = ["prepare"] }
serde_json = "1"
tokio = { version = "=1.52.3", features = ["rt", "time", "net"] }

[features]
default = ["prepare"]
prepare = ["dep:clinkz-wot-planning", "dep:clinkz-wot-td"]
