name: manual-validation

# Explicit opt-in only: no PR, push or scheduled full validation.
on:
  workflow_dispatch:
    inputs:
      level:
        description: Select the depth for this manual run
        required: true
        type: choice
        default: authority
        options:
          - authority
          - workspace
          - feature-matrix
          - full

permissions:
  contents: read

concurrency:
  group: manual-validation-${{ github.ref }}-${{ inputs.level }}
  cancel-in-progress: false

jobs:
  manual-validation:
    name: manual-${{ inputs.level }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          targets: thumbv7em-none-eabihf, thumbv6m-none-eabi

      - name: Validate current technical authority
        run: tools/check-design-artifacts.sh

      - name: Run locked workspace tests
        if: inputs.level != 'authority'
        run: cargo test --workspace --locked

      - name: Run supported feature matrix
        if: inputs.level == 'feature-matrix' || inputs.level == 'full'
        run: sh scripts/check-feature-matrix.sh

      - name: Run portable Property Read integration
        if: inputs.level == 'feature-matrix' || inputs.level == 'full'
        run: cargo test --locked -p clinkz-wot-servient --no-default-features --test property_read

      - name: Check production Planning and Servient feature variants
        if: inputs.level == 'full'
        run: |
          for features in validated-thing validated-thing,async; do
            cargo test --locked -p clinkz-wot-planning --no-default-features --features "$features"
          done
          cargo test --locked -p clinkz-wot-servient --no-default-features
          cargo test --locked -p clinkz-wot-servient --no-default-features --features async
          sh scripts/check-no-std.sh

      - name: Check production bounded TD admission and lending
        if: inputs.level == 'full'
        run: |
          for features in validated-thing validated-thing,serde_json/preserve_order; do
            cargo test --locked -p clinkz-wot-td --features "$features" --lib validated::tests
            cargo test --locked -p clinkz-wot-td --features "$features" --test validated_admission --test validated_lending
          done
          for features in validated-thing validated-thing,clinkz-wot-foundation/async; do
            cargo test --locked -p clinkz-wot-td --no-default-features --features "$features" --lib validated::tests
            cargo test --locked -p clinkz-wot-td --no-default-features --features "$features" --test validated_admission --test validated_lending
            cargo check --locked --target thumbv7em-none-eabihf -p clinkz-wot-td --no-default-features --features "$features"
          done
          cargo test --locked -p clinkz-wot-td --features validated-thing --doc

      - name: Join production TD semantics to plans and binding artifacts
        if: inputs.level == 'full'
        run: |
          manifest=td/tests/semantic-join/Cargo.toml
          cargo test --locked --manifest-path "$manifest"
          cargo test --locked --manifest-path "$manifest" --features order
          cargo test --locked --manifest-path "$manifest" --no-default-features
          cargo test --locked --manifest-path "$manifest" --no-default-features --features async
          cargo check --locked --target thumbv7em-none-eabihf --manifest-path "$manifest" --no-default-features
          cargo check --locked --target thumbv7em-none-eabihf --manifest-path "$manifest" --no-default-features --features async

      - name: Install ARM runtime emulator
        if: inputs.level == 'full'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm

      - name: Execute production TD with native and bare ARM allocators
        if: inputs.level == 'full'
        run: |
          td/tests/runtime/run.sh
          td/tests/runtime/run.sh --features async

      - name: Check production TD capability dependencies
        if: inputs.level == 'full'
        run: |
          manifest=td/tests/compile/validated-capability/Cargo.toml
          for profile in std portable async; do
            args=()
            prefix=""
            axes=(base ap)
            if [ "$profile" = std ]; then
              axes+=(order ap,order)
            else
              args+=(--no-default-features)
              if [ "$profile" = async ]; then prefix="async,"; fi
            fi
            for axis in "${axes[@]}"; do
              features="$prefix"
              if [ "$axis" != base ]; then features+="$axis,"; fi
              for activation in capability sibling; do
                cargo test --locked --manifest-path "$manifest" "${args[@]}" --features "${features}${activation},positive"
                cargo tree --locked --manifest-path "$manifest" "${args[@]}" --features "${features}${activation},positive" --edges normal --format '{p} features=[{f}]'
              done
              log="$(mktemp)"
              if cargo check --locked --manifest-path "$manifest" "${args[@]}" --features "${features}negative" >"$log" 2>&1; then
                cat "$log"
                exit 1
              fi
              grep -E 'unresolved imports.*td::ValidatedThing' "$log" || { cat "$log"; exit 1; }
              rm "$log"
              cargo test --locked --manifest-path "$manifest" "${args[@]}" --features "${features%,}"
            done
          done
          for prefix in '' async,; do
            for axis in '' ap,; do
              for activation in capability sibling; do
                cargo check --locked --target thumbv7em-none-eabihf --manifest-path "$manifest" --no-default-features --features "${prefix}${axis}${activation},positive"
              done
              log="$(mktemp)"
              if cargo check --locked --target thumbv7em-none-eabihf --manifest-path "$manifest" --no-default-features --features "${prefix}${axis}negative" >"$log" 2>&1; then
                cat "$log"
                exit 1
              fi
              grep -E 'unresolved imports.*td::ValidatedThing' "$log" || { cat "$log"; exit 1; }
              rm "$log"
            done
          done
